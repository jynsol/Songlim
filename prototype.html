<script>
(function(){
  window.renderHalfStarRating = function(el, value){
    if(!el) return;
    const v = Number(value)||0;
    el.innerHTML = "";
    for(let i=1;i<=5;i++){
      const s=document.createElement("span");
      s.className="star";
      const f=document.createElement("span");
      f.className="fill";
      if(v>=i) f.style.width="100%";
      else if(v>=i-0.5) f.style.width="50%";
      s.appendChild(f);
      el.appendChild(s);
    }
  };
})();
</script>

<script>
window.initRatingPicker=function(){
 const wrap=document.querySelector('[data-rating-picker]');
 const input=document.getElementById('ratingValue');
 const label=document.getElementById('ratingText');
 if(!wrap||!input)return;
 wrap.tabIndex=0;wrap.setAttribute('role','slider');wrap.setAttribute('aria-label','별점');wrap.setAttribute('aria-valuemin','0');wrap.setAttribute('aria-valuemax','5');
 const draw=(v)=>{
   v=Number(v)||0;wrap.setAttribute('aria-valuenow',String(v));wrap.setAttribute('aria-valuetext',v?v+'점':'별점 없음'); wrap.innerHTML='';
   for(let i=1;i<=5;i++){
     const s=document.createElement('span');
     s.className='star';
     const f=document.createElement('span'); f.className='fill';
     f.style.width=v>=i?'100%':(v>=i-.5?'50%':'0');
     s.appendChild(f);
     s.onpointerdown=(e)=>{
       const r=s.getBoundingClientRect();
       const half=e.clientX-r.left<r.width/2;
       const nv=(i-.5)+(half?0:0.5);
       input.value=nv;
       label.textContent=nv+'점';
       draw(nv);
     };
     wrap.appendChild(s);
   }
 };
 wrap.onkeydown=e=>{if(!['ArrowLeft','ArrowDown','ArrowRight','ArrowUp','Home','End'].includes(e.key))return;e.preventDefault();const step=['ArrowRight','ArrowUp'].includes(e.key)?.5:-.5;const v=e.key==='Home'?0:e.key==='End'?5:Math.max(0,Math.min(5,(Number(input.value)||0)+step));input.value=v||'';if(label)label.textContent=v?v+'점':'선택 안 함';draw(v)};
 draw(input.value);
};
</script>

}
function mountTreeIllustrations(){
 if(document.getElementById('songlim-tree-sprites'))return;
 const sprites=document.createElementNS('http://www.w3.org/2000/svg','svg');

}
function ensureSonglimIllustration(id,family='tree'){
 const asset=family==='tree'?SONGLIM_TREE_ASSETS[id]:SONGLIM_FOREST_ASSETS[id];if(!asset)return;
 const prefix='songlim-'+family+'-',imageId=prefix+id;if(document.getElementById(imageId))return;

 image.setAttribute('width',asset.width||1254);image.setAttribute('height',asset.height||1254);image.setAttribute('href',asset.src);

}

const forestExportAssetPromises=new Map();
function forestExportAssetDataURL(src){
 if(/^data:/i.test(src))return Promise.resolve(src);
 const url=new URL(src,document.baseURI).href;
 if(forestExportAssetPromises.has(url))return forestExportAssetPromises.get(url);
 const pending=(async()=>{
  const response=await fetch(url);
  if(!response.ok)throw new Error('숲의 이미지를 불러오지 못했어요. 다시 시도해 주세요.');
  const blob=await response.blob();
  if(!blob.size)throw new Error('숲의 이미지 파일이 비어 있어요.');
  return await new Promise((resolve,reject)=>{
   const reader=new FileReader();
   reader.onload=()=>resolve(reader.result);
   reader.onerror=()=>reject(new Error('숲의 이미지 파일을 읽지 못했어요.'));
   reader.readAsDataURL(blob);
  });
 })();
 forestExportAssetPromises.set(url,pending);
 pending.catch(()=>{if(forestExportAssetPromises.get(url)===pending)forestExportAssetPromises.delete(url);});
 return pending;
}
async function selfContainedForestSVG(markup){
 // Load and embed only illustrations used by this scene; cache successful exports.
 const trees=[...new Set([...markup.matchAll(/data-tree-illustration="([a-z]+)"/g)].map(m=>m[1]))];
 const details=[...new Set([...markup.matchAll(/data-forest-illustration="([a-z-]+)"/g)].map(m=>m[1]))];
 const defs=treeIllustrationDefs(trees)+forestIllustrationDefs(details);
 if(defs)markup=markup.includes('<defs>')?markup.replace('<defs>','<defs>'+defs):markup.replace(/(<svg\b[^>]*>)/,'$1<defs>'+defs+'</defs>');
 const parsed=new DOMParser().parseFromString(markup,'image/svg+xml');
 if(parsed.querySelector('parsererror'))throw new Error('숲의 이미지를 만들지 못했어요.');
 const images=[...parsed.querySelectorAll('image')];
 await Promise.all(images.map(async image=>{
  const src=image.getAttribute('href')||image.getAttributeNS('http://www.w3.org/1999/xlink','href');
  if(!src||/^data:/i.test(src))return;
  const dataURL=await forestExportAssetDataURL(src);
  image.setAttribute('href',dataURL);
  if(image.hasAttributeNS('http://www.w3.org/1999/xlink','href'))image.setAttributeNS('http://www.w3.org/1999/xlink','xlink:href',dataURL);
 }));
 return new XMLSerializer().serializeToString(parsed.documentElement);
}

function overrideBookGenre(title){
 const norm=Model.norm(String(title||'').replace(/\s*\d+\s*$/,''));
 const hit=BOOK_GENRE_OVERRIDES.find(([name])=>norm===Model.norm(name)||norm.startsWith(Model.norm(name)));
 return hit?.[1]||'';
}
function inferBookGenre(data){
 const title=String(data?.title||'').normalize('NFKC'),body=[data?.contents,data?.overview,data?.description,data?.publisher,data?.creator,data?.rawGenre].filter(Boolean).join(' ').normalize('NFKC');
 const override=overrideBookGenre(title);if(override)return override;
 let best='',bestScore=0;
 for(const [name,res] of BOOK_GENRE_RULES){let score=0;for(const re of res){re.lastIndex=0;if(re.test(title))score+=5;re.lastIndex=0;if(re.test(body))score+=3;re.lastIndex=0}if(score>bestScore){best=name;bestScore=score}}
 if(bestScore>=3)return best;
 const narrative=(body.match(/주인공|등장인물|장편|단편|작가의\s*데뷔작|소설가|이야기의\s*배경|서사|허구/g)||[]).length;
 return narrative>=2?'소설':'';
}
function normalizeBookGenre(raw,data){
 const value=cleanGenreValue(raw),merged={...(data||{}),rawGenre:value};
 const known=BOOK_GENRE_RULES.find(([name])=>name.toLocaleLowerCase()===value.toLocaleLowerCase());
 if(known)return known[0];
 if(value){const normalized=inferBookGenre({title:'',contents:value,creator:'',publisher:'',rawGenre:value});if(normalized)return normalized;}
 return inferBookGenre(merged);
}

function isExcludedBookCandidate(book){
 // 소개문(contents)은 보지 않는다. 일반 문학의 '스릴러의 교과서' 같은 표현 오탐 방지.
 const title=compactBookTitle(book?.title);
 const searchable=[
  title,
  book?.genre,
  book?.rawGenre
 ].filter(Boolean).join(' ').replace(/<[^>]+>/g,' ');
 const publisher=String(book?.publisher||'');

 // '한국소설'은 정기간행물/잡지 계열 제목으로 취급해 제목에 포함되면 제외.
 // 또한 연+월/호 조합이 있는 문학 정기간행물형 제목도 제외한다.
 const normalizedTitle=title.replace(/\s+/g,' ').trim();
 const koreanNovelPeriodical=
   normalizedTitle.includes('한국소설')
   ||/(계간|계간지|봄호|여름호|가을호|겨울호|\d{1,2}\s*월호|월호)/i.test(normalizedTitle)
   ||(/(19|20)\d{2}\s*년/.test(normalizedTitle)&&/\d{1,2}\s*월/.test(normalizedTitle)&&/\d{1,4}\s*호/.test(normalizedTitle))
   ||(/(문학|소설|시|비평|문예)/.test(normalizedTitle)&&/\d{1,4}\s*호/.test(normalizedTitle))
   ||(/(문학|소설|시|비평|문예)/.test(normalizedTitle)&&/(봄|여름|가을|겨울)\s*(호|편)?/i.test(normalizedTitle));

 // 띄어쓰기/괄호/구두점 차이에도 잡히도록 제목의 공백 제거본도 함께 본다.
 const compact=title.replace(/\s+/g,'');

 const anthologyCompact=
   /((한국|세계|동양|서양|현대|고전|명작)?(단편소설|고전소설|명작소설|단편문학|고전문학|명작문학|한국문학|세계문학)\d{1,3}(선|편|권)?$)|((단편소설|고전소설|명작소설|단편문학|고전문학|명작문학|한국문학|세계문학)(선집|모음|컬렉션)$)/i.test(compact);

 return BOOK_EXCLUDED_SEARCH_RE.test(searchable)
   ||BOOK_EDUCATIONAL_COLLECTION_RE.test(title)
   ||BOOK_ANTHOLOGY_COLLECTION_RE.test(title)
   ||anthologyCompact
   ||koreanNovelPeriodical
   ||BOOK_PERIODICAL_RE.test(title)
   ||BOOK_EXCLUDED_PUBLISHER_RE.test(publisher);
}
function allowDiscoveryCandidate(item){
 if(!item||!item.title||!['book','album','movie'].includes(item.type))return false;
 if(item.type==='book'&&isExcludedBookCandidate(item))return false;
 return true;
}

function forestGenreLabel(c){
 const value=cleanGenreValue(c.genre).replace(/\s+/g,' ');if(!value)return '';
 const key=Model.norm(value),known=(GENRE_POOL[c.type]||[]).find(label=>Model.norm(label)===key);
 if(known)return known;
 // Keep a person's custom classification; normalize provider labels without guessing from a title.

function forestGenreStats(items){
 const completed=items.filter(c=>c.completed),counts=new Map();let classified=0;
 for(const c of completed){
  const label=forestGenreLabel(c);if(!label)continue;classified++;
  const key=Model.norm(label),entry=counts.get(key);
  const latest=c.completed==='unknown'?'':c.completed,latestAt=Number(c.completedAt)||0;
  if(entry){entry.count++;if(latest>entry.latest||(latest===entry.latest&&latestAt>entry.latestAt)){entry.latest=latest;entry.latestAt=latestAt}}
  else counts.set(key,{label,count:1,latest,latestAt});
 }
 const ranked=[...counts.values()].sort((a,b)=>b.count-a.count||b.latest.localeCompare(a.latest)||b.latestAt-a.latestAt||a.label.localeCompare(b.label,'ko'));
 const count=ranked[0]?.count||0,top=ranked.slice(0,1);

}

<script id="songrim-notifications">

// Drop-in ground artwork: append defs inside the parent SVG's <defs>, then
// body before the forest's depth-sorted scene. Tree projection stays untouched.
function forestGroundArtwork(cfg, theme, cx = 360, cy = 286) {
  const snow = theme === 'snow';
  const rx = cfg.boardW / 2 + 44;
  const ry = cfg.boardH / 2 + 34;
  const depth = Math.min(12.5, 7.5 + rx * .013) + (snow ? 1.5 : 0);
  const corner = Math.min(.17, Math.max(.10, 36 / Math.hypot(rx, ry)));
  const p = (x, y, dy = 0) => `${(cx + x * rx).toFixed(1)} ${(cy + y * ry + dy).toFixed(1)}`;
  const q = corner;
  // The original diamond's four axes and margins are retained. Gentle cubic
  // edges and wider corners soften the outline without shrinking the planting area.
  const outline = (dy = 0) =>
    `M${p(-q, -1 + q, dy)} Q${p(0, -1, dy)} ${p(q, -1 + q, dy)}` +
    ` C${p(.34, -.67, dy)} ${p(.69, -.33, dy)} ${p(1 - q, -q, dy)}` +
    ` Q${p(1, 0, dy)} ${p(1 - q, q, dy)}` +
    ` C${p(.69, .32, dy)} ${p(.34, .69, dy)} ${p(q, 1 - q, dy)}` +
    ` Q${p(0, 1, dy)} ${p(-q, 1 - q, dy)}` +
    ` C${p(-.35, .67, dy)} ${p(-.68, .34, dy)} ${p(-1 + q, q, dy)}` +
    ` Q${p(-1, 0, dy)} ${p(-1 + q, -q, dy)}` +
    ` C${p(-.69, -.32, dy)} ${p(-.35, -.69, dy)} ${p(-q, -1 + q, dy)} Z`;
  const topPath = outline();
  const kind = snow ? 'snow' : 'basic';
  const id = `forest-ground-${kind}-${[rx, ry, cx, cy].map(v => Math.round(v * 10)).join('-')}`;
  const palette = snow
    ? {top: ['#FCFCF8', '#EFF4F3', '#DFEAEB'], side: ['#D1DFE1', '#BFD1D5', '#AEBFC7'], shadow: '#81949B', light: '#FFFEF8', cool: '#C8DBE0', warm: '#F9FCF9'}
    : {top: ['#E9EFDC', '#DCE7CF', '#CDDCBC'], side: ['#C3CBB4', '#B2BBA1', '#A1AB92'], shadow: '#7F8974', light: '#F4F3DC', cool: '#BCD0AD', warm: '#E8EBD0'};
  const gradient = (name, colors) =>
    `<linearGradient id="${id}-${name}" x1="0" y1="0" x2="1" y2="1">` +
    `<stop offset="0" stop-color="${colors[0]}"/><stop offset=".58" stop-color="${colors[1]}"/>` +
    `<stop offset="1" stop-color="${colors[2]}"/></linearGradient>`;
  const defs = gradient('top', palette.top) + gradient('side', palette.side) +
    `<clipPath id="${id}-clip"><path d="${topPath}"/></clipPath>`;
  const lightField = `M${p(-1.05, -.08)} C${p(-.68, -.40)} ${p(-.30, -1.0)} ${p(.10, -.92)}` +
    ` C${p(.44, -.86)} ${p(.28, -.49)} ${p(-.04, -.31)}` +
    ` C${p(-.40, -.08)} ${p(-.65, .06)} ${p(-1.05, -.08)} Z`;
  const coolField = `M${p(.12, -.18)} C${p(.47, -.35)} ${p(.91, -.17)} ${p(1.08, .03)}` +
    ` L${p(.21, .99)} C${p(-.10, .68)} ${p(.05, .50)} ${p(.37, .24)}` +
    ` C${p(.56, .08)} ${p(.40, -.04)} ${p(.12, -.18)} Z`;
  const warmField = `M${p(-.84, .19)} C${p(-.45, .10)} ${p(-.18, .21)} ${p(.17, .44)}` +
    ` C${p(.34, .55)} ${p(.40, .73)} ${p(.13, .97)}` +
    ` C${p(-.28, .83)} ${p(-.68, .47)} ${p(-.84, .19)} Z`;
  // The snow lip is a filled shallow ribbon, not an outline or an extra filter.
  const lip = snow
    ? `<path data-ground-snow-lip="true" d="${outline(2.7)}" fill="#E9F0EF"/>`
    : '';
  // A close contact shadow follows the island footprint instead of floating below it.
  const body = `<g data-forest-ground="soft-island" data-theme="${kind}" pointer-events="none">` +
    `<path data-ground-shadow="contact" d="${outline(depth + 3)}" transform="translate(2 0)" fill="${palette.shadow}" opacity=".08"/>` +
    `<path data-ground-side="true" d="${outline(depth)}" fill="url(#${id}-side)"/>` + lip +
    `<path data-ground-surface="true" d="${topPath}" fill="url(#${id}-top)"/>` +
    `<g clip-path="url(#${id}-clip)">` +
    `<path d="${lightField}" fill="${palette.light}" opacity="${snow ? '.50' : '.25'}"/>` +
    `<path d="${coolField}" fill="${palette.cool}" opacity="${snow ? '.19' : '.17'}"/>` +
    `<path d="${warmField}" fill="${palette.warm}" opacity="${snow ? '.28' : '.16'}"/>` +
    `</g></g>`;
  return {defs, body};
}

function bookSearchScore(book,query,index=0){
 const q=Model.norm(query),title=Model.norm(book?.title),core=bookSearchCoreTitle(book?.title),creator=Model.norm(book?.creator);
 if(!q||!title)return -9999-index;

 const tokens=q.split(/\s+/).filter(Boolean);
 const creatorParts=String(book?.creator||'')
   .split(/[,/&·]|\s+저|\s+역/)
   .map(Model.norm)
   .filter(Boolean);

 const creatorExact=creator===q||creatorParts.includes(q);
 const creatorStarts=creator.startsWith(q)||creatorParts.some(x=>x.startsWith(q));
 const adultCandidate=isAdultBook(book);
 const titleExact=title===q;
 const coreExact=core===q;

 let score=0;

 // Query relevance itself remains the strongest signal.
 if(titleExact)score+=1450;
 else if(coreExact)score+=1320;
 else if(title.startsWith(q))score+=850;
 else if(title.includes(q))score+=680;
 else if(core.includes(q)||q.includes(core))score+=440;

 // 성인 콘텐츠의 저자 필드가 시리즈명/브랜드명처럼 검색어와 일치하는 경우를 방지
 if(creatorExact && !adultCandidate)score+=1420;
 else if(creatorStarts && !adultCandidate)score+=930;
 else if(creator.includes(q) && !adultCandidate)score+=720;

 const matched=tokens.filter(t=>title.includes(t)||creator.includes(t)).length;
 score+=matched*75;
 if(tokens.length&&matched===tokens.length)score+=130;

 // Generic server search-mode evidence:
 // - title-target result + exact title => stronger edition candidate
 // - person-target result + exact creator => stronger author candidate
 if(book?.serverTargets?.includes('title')&&(titleExact||coreExact))score+=520;
 if(book?.serverTargets?.includes('person')&&(creatorExact||creatorStarts)&&!adultCandidate)score+=560;
 if(book?.serverTargets?.includes('general'))score+=80;

 // A result returned by the server through multiple query modes is
 // stronger evidence than a one-off fringe hit.
 const hits=Math.max(1,Number(book?.serverHitCount)||1);
 score+=Math.min(260,(hits-1)*85);

 // Prefer complete, usable Korean-edition metadata.
 if(book?.isbn)score+=30;
 if(book?.publisher)score+=22;
 if(book?.cover)score+=22;
 if(book?.publishedAt)score+=12;
 score+=bookEditionTrust(book)*175;
 score+=bookPublisherTrust(book)*145;

 // Use popularity only when the server actually supplies it.
 const pop=Math.max(0,Number(book?.searchPopularity)||0);
 if(pop)score+=Math.min(190,Math.log10(pop+1)*42);
 const rating=Math.max(0,Number(book?.averageRating)||0);
 if(rating)score+=Math.min(35,rating*6);

 // YES24 popularity enrichment. Query relevance still dominates.
 const yesPop=Math.max(0,Number(book?.yes24PopularityScore)||0);
 if(yesPop)score+=Math.min(220,yesPop*1.25);

 const salePoint=Math.max(0,Number(book?.yes24SalePoint)||0);
 if(salePoint)score+=Math.min(120,Math.log10(salePoint+1)*28);

 const yesStar=Math.max(0,Number(book?.yes24StarScore)||0);
 if(yesStar)score+=Math.min(24,yesStar*2.4);

 if(book?.yes24Found)score+=18;
 if(book?.yes24BestsellerRank)score+=Math.max(0,70-Math.log10(book.yes24BestsellerRank+1)*24);
 if(book?.yes24SteadyRank)score+=Math.max(0,45-Math.log10(book.yes24SteadyRank+1)*18);

 // For broad/common keywords, popularity should help decide between similarly
 // relevant titles (e.g. general nouns like 편의점, 사랑, 여행).
 if(q.length<=4){
   const broadPop=(Number(book?.yes24SalePoint)||0)+(Number(book?.searchPopularity)||0);
   score+=Math.min(260,Math.log10(broadPop+1)*55);
 }

 // Server/provider ordering is a tie-breaker, not the main ranker.
 const providerRank=Math.max(0,Number(book?.bestServerRank)||index);
 score+=Math.max(0,55-providerRank*1.5);

 return score;
}



function creatorMatchTier(book,query){
 const q=Model.norm(query),creator=Model.norm(book?.creator);
 if(!q||!creator)return 0;
 const parts=String(book?.creator||'')
   .split(/[,/&·]|\s+저|\s+역/)
   .map(Model.norm)
   .filter(Boolean);

 if(creator===q||parts.includes(q))return 3;
 if(creator.startsWith(q)||parts.some(x=>x.startsWith(q)))return 2;
 if(creator.includes(q))return 1;
 return 0;
}

function titleMatchTier(book,query){
 const q=Model.norm(query),title=Model.norm(book?.title),core=bookSearchCoreTitle(book?.title);
 if(!q||!title)return 0;
 if(title===q||core===q)return 4;
 if(title.startsWith(q))return 3;
 if(title.includes(q))return 2;
 if(core.includes(q)||q.includes(core))return 1;
 return 0;
}

function bookPopularityRankScore(book){
 let score=0;

 // YES24 signals
 const yesPop=Math.max(0,Number(book?.yes24PopularityScore)||0);
 const salePoint=Math.max(0,Number(book?.yes24SalePoint)||0);
 const star=Math.max(0,Number(book?.yes24StarScore)||0);
 if(yesPop)score+=Math.min(260,yesPop*1.45);
 if(salePoint)score+=Math.min(180,Math.log10(salePoint+1)*40);
 if(book?.yes24BestsellerRank)score+=Math.max(0,95-Math.log10(Number(book.yes24BestsellerRank)+1)*28);
 if(book?.yes24SteadyRank)score+=Math.max(0,70-Math.log10(Number(book.yes24SteadyRank)+1)*22);
 if(star)score+=Math.min(28,star*2.8);
 if(book?.yes24Found)score+=15;

 // Server/provider popularity if present
 const pop=Math.max(0,Number(book?.searchPopularity)||0);
 if(pop)score+=Math.min(180,Math.log10(pop+1)*40);

 // Provider rank is only a weak fallback when explicit popularity is sparse.
 const providerRank=Math.max(0,Number(book?.bestServerRank)||0);
 score+=Math.max(0,45-providerRank*1.2);

 // Edition trust remains a small tie-breaker, not "popularity".
 score+=bookPublisherTrust(book)*24;
 score+=bookEditionTrust(book)*18;

 return score;
}

function detectBookQueryMode(list,query){
 const q=Model.norm(query);
 if(!q)return 'general';

 let creatorStrong=0,titleStrong=0;
 for(const book of list||[]){
  if(creatorMatchTier(book,q)>=2)creatorStrong++;
  if(titleMatchTier(book,q)>=3)titleStrong++;
 }

 // If several results clearly identify the query as an author/person,
 // treat it as author search. No hardcoded author list is used.
 if(creatorStrong>=2 && creatorStrong>titleStrong)return 'author';
 return 'general';
}

function compareBooksForQuery(a,b,query,mode){
 if(mode==='author'){
  const ca=creatorMatchTier(a,query),cb=creatorMatchTier(b,query);
  if(ca!==cb)return cb-ca;

  // Within the same author-match group, popularity is the primary order.
  const pa=bookPopularityRankScore(a),pb=bookPopularityRankScore(b);
  if(Math.abs(pa-pb)>.001)return pb-pa;

  // Then fall back to detailed relevance/edition quality.
  return bookSearchScore(b,query,b.__searchIndex||0)-bookSearchScore(a,query,a.__searchIndex||0);
 }

 return bookSearchScore(b,query,b.__searchIndex||0)-bookSearchScore(a,query,a.__searchIndex||0);
}

function mergeAndRankBooks(primary,supplement,query){
 const map=new Map();

 const put=(book,index,origin)=>{
  const isbn=String(book?.isbn||'').replace(/\D/g,'');
  const key=isbn.length>=10
    ?'isbn:'+isbn
    :'work:'+Model.norm(book?.title)+'|'+Model.norm(book?.creator)+'|'+Model.norm(book?.publisher);

  const incomingTargets=Array.isArray(book?.serverTargets)?book.serverTargets:[];
  const candidate={
   ...book,
   serverTargets:[...new Set(incomingTargets)],
   serverHitCount:Number(book?.serverHitCount)||1,
   bestServerRank:Number.isFinite(Number(book?.bestServerRank))?Number(book.bestServerRank):index,
   __searchIndex:index,
   __searchOrigin:origin
  };

  const existing=map.get(key);
  if(!existing){
   map.set(key,candidate);
   return;
  }

  const merged={
   ...existing,
   ...candidate,
   cover:existing.cover||candidate.cover,
   publisher:existing.publisher||candidate.publisher,
   isbn:existing.isbn||candidate.isbn,
   publishedAt:existing.publishedAt||candidate.publishedAt,
   contents:[existing.contents,candidate.contents].filter(Boolean).sort((a,b)=>b.length-a.length)[0]||'',
   searchPopularity:Math.max(Number(existing.searchPopularity)||0,Number(candidate.searchPopularity)||0),
   averageRating:Math.max(Number(existing.averageRating)||0,Number(candidate.averageRating)||0),
   yes24Found:Boolean(existing.yes24Found||candidate.yes24Found),
   yes24PopularityScore:Math.max(Number(existing.yes24PopularityScore)||0,Number(candidate.yes24PopularityScore)||0),
   yes24SalePoint:Math.max(Number(existing.yes24SalePoint)||0,Number(candidate.yes24SalePoint)||0),
   yes24StarScore:Math.max(Number(existing.yes24StarScore)||0,Number(candidate.yes24StarScore)||0),
   yes24BestsellerRank:[existing.yes24BestsellerRank,candidate.yes24BestsellerRank].filter(Boolean).sort((a,b)=>a-b)[0]||null,
   yes24SteadyRank:[existing.yes24SteadyRank,candidate.yes24SteadyRank].filter(Boolean).sort((a,b)=>a-b)[0]||null,
   length:existing.length||candidate.length||null,
   serverTargets:[...new Set([...(existing.serverTargets||[]),...(candidate.serverTargets||[])])],
   serverHitCount:(Number(existing.serverHitCount)||1)+(Number(candidate.serverHitCount)||1),
   bestServerRank:Math.min(Number(existing.bestServerRank)||999,Number(candidate.bestServerRank)||999),
   __searchIndex:Math.min(Number(existing.__searchIndex)||999,index)
  };
  map.set(key,merged);
 };

 (primary||[]).forEach((b,i)=>put(b,i,'server'));
 (supplement||[]).forEach((b,i)=>put(b,i+100,'server-extra'));

 const ranked=[...map.values()].filter(b=>!isExcludedBookCandidate(b));
 const mode=detectBookQueryMode(ranked,query);

 // 성인 콘텐츠는 점수 경쟁에서 제외하고 항상 일반 콘텐츠 뒤로 보낸다.
 const normalBooks=ranked.filter(b=>!isAdultBook(b));
 const adultBooks=ranked.filter(b=>isAdultBook(b));

 normalBooks.sort((a,b)=>compareBooksForQuery(a,b,query,mode));
 adultBooks.sort((a,b)=>compareBooksForQuery(a,b,query,mode));

 return [...normalBooks,...adultBooks]
   .map(({__searchIndex,__searchOrigin,...b})=>b);
}

async function fetchServerBookBatch(query,{target='',page=1,size=50}={}){

  });

async function loadMoreBookResults(){
 if(bookSearchLoadingMore||!bookSearchHasMore||!bookSearchActiveQuery)return;

 const query=bookSearchActiveQuery,page=bookSearchNextPage,seq=bookSearchSeq;
 bookSearchLoadingMore=true;
 renderRemoteBooks(remoteBookResults);

 try{
  const before=new Set(bookSearchRawResults.map(bookResultKey));
  const more=await searchServerBookPage(query,page);

  if(seq!==bookSearchSeq||query!==bookSearchActiveQuery)return;

  const fresh=more.filter(book=>!before.has(bookResultKey(book)));
  if(fresh.length){
   bookSearchRawResults.push(...more);
   bookSearchStagnantPages=0;
  }else{
   bookSearchStagnantPages++;
  }

  bookSearchNextPage=page+1;

  // Stop only when the server truly runs out, or repeats the same page
  // several times (some providers ignore page parameters).
  if(!more.length||bookSearchStagnantPages>=2||page>=30){
   bookSearchHasMore=false;
  }

  remoteBookResults=mergeAndRankBooks(bookSearchRawResults,[],query)
   .filter(c=>!isExcludedBookCandidate(c));

  // 여기서 다시 그리지 않는다 - 아래 finally에서 한 번만 그린다.
  // (여기서도 그리면 finally와 연달아 두 번 그려져 감지기가 중복 발동한다.)
  enrichBookPopularity(remoteBookResults,seq).catch(()=>{});

  const pending=remoteBookResults
   .filter(book=>!cleanGenreValue(book.genre))
   .slice(0,8);
  if(pending.length){
   Promise.all(pending.map(enrichBookGenre))
    .then(()=>{if(seq===bookSearchSeq&&$('catalogResults'))renderRemoteBooks(remoteBookResults)})
    .catch(()=>{});
  }
 }catch{
  if(seq===bookSearchSeq){
   bookSearchHasMore=false;
  }
 }finally{
  if(seq===bookSearchSeq){bookSearchLoadingMore=false;if($('catalogResults'))renderRemoteBooks(remoteBookResults)}
 }
}

// 책 검색의 Model.norm(공백+문장부호 제거)은 그대로 쓰되, 부제를 통째로
// 잘라내는 bookSearchCoreTitle의 콜론-부제 제거는 영화에 그대로 옮기지 않는다.
// 책은 "제목: 부제"가 대개 같은 책의 다른 판(edition)이라 부제를 떼도 같은
// 작품이지만, 영화는 "제목: 부제"가 서로 다른 별개 작품인 경우가 흔하다
// (예: "식스센스: 속보이는 여자들"은 "식스 센스"(1999)와 무관한 작품).
// 그 규칙을 그대로 썼다가 오히려 동명이작을 "핵심 제목 완전 일치"로
// 오판하게 만든 게 바로 이번에 재현된 버그였다. 그래서 여기서는 괄호/대괄호
// 안의 부가 정보(예: "(2020)", "(리마스터판)")만 걷어내고, 콜론 뒤 부제는
// 그대로 남겨 둔다 — Model.norm이 콜론 "문자"만 지워도 부제 "텍스트"는
// 남으므로 동명이작과는 여전히 구분된다.
function movieSearchCoreTitle(value){
 return Model.norm(String(value||'')
   .replace(/\([^)]*\)|\[[^\]]*\]|\{[^}]*\}/g,' ')
   .replace(/\s+/g,' '));
}

 const genres=movieGenreInfo(d?.genre_ids??d?.genreIds);
 const searchPopularity=Number(d?.popularity??0)||0;
 const voteCount=Number(d?.vote_count??d?.voteCount??0)||0;
 const averageRating=Number(d?.vote_average??d?.voteAverage??d?.rating??0)||0;
 const runtime=Number(d?.runtime??d?.runtime_minutes??d?.runtimeMinutes??0)||null;
 return {type:'movie',title:String(d?.title||'').trim(),creator:String(d?.director||d?.creator||'').trim(),cover:String(d?.poster_url||d?.posterUrl||d?.poster||'').trim(),genre:genres.primary,rawGenre:genres.candidates.map(x=>x[0]).join(', '),genreSource:'auto',genreCandidates:genres.candidates,provider:String(d?.provider||'tmdb').trim(),providerId:String(providerId||'').trim(),releaseDate:release,originalTitle,originalLanguage:String(d?.original_language||d?.originalLanguage||'').trim(),overview:String(d?.overview||'').trim(),genreIds:Array.isArray(d?.genre_ids)?d.genre_ids.map(Number).filter(Number.isFinite):Array.isArray(d?.genreIds)?d.genreIds.map(Number).filter(Number.isFinite):[],catalogUrl:String(d?.external_url||d?.externalUrl||d?.catalogUrl||'').trim(),source:'TMDB 영화 검색',searchPopularity,voteCount,averageRating,runtime};
}

function movieSearchScore(movie,query,index=0){
 // 공백만 지우는 게 아니라 책 검색과 같은 기준(Model.norm)으로 비교하고,
 // 부제/괄호를 뗀 핵심 제목(core title)까지 함께 봐서 "정확히 그 작품"을
 // 콜론-부제가 붙은 동명이작과 확실히 구분한다.
 const q=Model.norm(query);
 const title=Model.norm(movie?.title),core=movieSearchCoreTitle(movie?.title);
 const original=Model.norm(movie?.originalTitle),originalCore=movieSearchCoreTitle(movie?.originalTitle);
 if(!q||!title)return -9999-index;
 let score=0;
 const titleExact=title===q||core===q;
 const originalExact=original===q||originalCore===q;
 if(titleExact)score+=1200;
 else if(originalExact)score+=1080;
 else if(title.startsWith(q)||core.startsWith(q))score+=760;
 else if(title.includes(q)||original.includes(q))score+=620;
 else if(core.includes(q)||originalCore.includes(q)||(core&&q.includes(core)))score+=380;
 // 감독/출연자 매칭 — 현재 원격 응답에 creator(감독)가 채워지지 않는 경우가
 // 많아 당장은 대부분 발동하지 않지만, 나중에 채워지면 바로 반영되도록 둔다.
 const creator=Model.norm(movie?.creator);
 if(creator&&creator===q)score+=900;
 else if(creator&&creator.startsWith(q))score+=500;
 else if(creator&&creator.includes(q))score+=300;
 const pop=Math.max(0,Number(movie?.searchPopularity)||0),votes=Math.max(0,Number(movie?.voteCount)||0),rating=Math.max(0,Number(movie?.averageRating)||0);
 if(pop)score+=Math.min(220,Math.log10(pop+1)*75);
 if(votes)score+=Math.min(220,Math.log10(votes+1)*62);
 if(votes>=100)score+=Math.min(75,rating*8);
 if(movie?.cover)score+=15;
 if(movie?.releaseDate)score+=8;
 score+=Math.max(0,24-index);
 return score;
}
function rankMovies(results,query){
 return [...results].sort((a,b)=>movieSearchScore(b,query)-movieSearchScore(a,query)).slice(0,12);
}
// 결과 중 "이 정도면 정답으로 확신할 만한" 매치가 있는지 — 있으면 굳이
// 추가 조회(재조회)를 하지 않는다. 없으면 아래 rescue 단계로 넘어간다.
// 주의: startsWith는 "확신"의 기준으로 쓰면 안 된다. 바로 이 버그 케이스
// ("식스센스: 속보이는 여자들"이 "식스센스"로 시작함)가 startsWith를
// 확신 기준에 넣었을 때 rescue를 건너뛰게 만든 원인이었다. 완전 일치만
// 확신으로 인정한다.
function movieHasConfidentMatch(results,query){
 const q=Model.norm(query);
 if(!q)return true;
 return (results||[]).some(c=>{
  const title=Model.norm(c?.title),core=movieSearchCoreTitle(c?.title);
  const original=Model.norm(c?.originalTitle),originalCore=movieSearchCoreTitle(c?.originalTitle);
  return title===q||core===q||original===q||originalCore===q;
 });
}
// "식스센스"(공백 없음) vs "식스 센스"(공백 있음)처럼, 원격 검색 API가
// 띄어쓰기 차이만으로 완전히 다른 결과 집합을 돌려주는 경우를 대비한다.
// 입력값을 그대로 1회만 조회하지 않고, 확신할 만한 매치가 없을 때만
// 공백을 뗀/끼워 넣은 변형들을 추가로 조회해 후보를 넓힌다.
function movieSpacingRescueQueries(query){
 const trimmed=String(query||'').trim();
 const variants=new Set();
 const noSpace=trimmed.replace(/\s+/g,'');
 if(noSpace&&noSpace!==trimmed)variants.add(noSpace);
 if(!/\s/.test(trimmed)){
  const chars=[...trimmed];
  if(chars.length>=2&&chars.length<=10){
   for(let i=1;i<chars.length;i++)variants.add(chars.slice(0,i).join('')+' '+chars.slice(i).join(''));
  }
 }
 variants.delete(trimmed);
 return [...variants].slice(0,8);
}

async function fetchMovieSearchPayload(query){
 const res=await fetch(MOVIE_SEARCH_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({query})});
 const text=await res.text();let payload={};try{payload=text?JSON.parse(text):{}}catch{payload={message:text}}
 if(!res.ok){const detail=payload?.error||payload?.message||('HTTP '+res.status);if(res.status===401)throw Error('검색 서버에서 인증 오류가 발생했어요. Edge Function의 Verify JWT 설정을 확인해주세요.');throw Error(detail)}
 return payload;
}
function movieResultKey(c){
 if(c?.provider&&c?.providerId)return c.provider+'|'+c.providerId;
 return Model.norm(c?.title)+'|'+String(c?.releaseDate||'').slice(0,4);
}
async function movieSearchResults(q){
 const query=String(q||'').trim(),seq=++movieSearchSeq;
 if(!query){remoteMovieResults=[];renderRemoteMovies([], '영화 제목을 입력해주세요.');return}
 const el=$('movieCatalogResults');if(el)el.innerHTML='<p class="creator">검색 중…</p>';
 const pool=new Map();
 const absorb=payload=>{
  unwrapMovies(payload).map(normalizeRemoteMovie).filter(c=>c.title).forEach(c=>{
   const key=movieResultKey(c);
   if(!pool.has(key))pool.set(key,c);
  });
 };
 try{
  // 1차 결과는 반드시 먼저 사용자에게 보여준다.
  // rescue 조회를 기다리면서 렌더링을 막으면 입력 중 요청 폭주와
  // 화면 재시작처럼 보이는 현상이 발생하므로 책 검색과 같은 흐름으로 분리한다.
  const primary=await fetchMovieSearchPayload(query);
  if(seq!==movieSearchSeq||!$('movieCatalogResults'))return;
  absorb(primary);

  remoteMovieResults=rankMovies([...pool.values()],query);
  renderRemoteMovies(remoteMovieResults);

  // 보강 조회는 렌더링 이후 백그라운드에서 한 번만 수행한다.
  if(!movieHasConfidentMatch(remoteMovieResults,query)){
   const rescueQueries=movieSpacingRescueQueries(query);
   if(rescueQueries.length){
    const settled=await Promise.all(rescueQueries.map(v=>fetchMovieSearchPayload(v).catch(()=>null)));
    if(seq!==movieSearchSeq||!$('movieCatalogResults'))return;
    const before=new Set([...pool.keys()]);
    settled.forEach(p=>{if(p)absorb(p)});
    const changed=[...pool.keys()].some(k=>!before.has(k));
    if(changed){
     remoteMovieResults=rankMovies([...pool.values()],query);
     renderRemoteMovies(remoteMovieResults);
    }
   }
  }
 }catch(err){
  if(seq!==movieSearchSeq||!$('movieCatalogResults'))return;
  remoteMovieResults=[];
  renderRemoteMovies([],err?.message||'영화 검색 서버에 연결하지 못했어요.');
 }
}

<script>
let forestViewportYear=null,forestViewportFrame=null;
function forestCameraFrame(vp,world,bounds=world.getBBox()){
 const unit=Math.min(vp.clientWidth/720,vp.clientHeight/540)||1;
 const padding=12,visibleW=vp.clientWidth/unit,visibleH=vp.clientHeight/unit;
 const fit=Math.min((vp.clientWidth-padding*2)/(Math.max(1,bounds.width)*unit),(vp.clientHeight-padding*2)/(Math.max(1,bounds.height)*unit));
 return {bounds:{x:bounds.x,y:bounds.y,width:bounds.width,height:bounds.height},unit,visibleW,visibleH,padding:padding/unit,fit,min:fit*.92,max:fit*3.25,cx:bounds.x+bounds.width/2,cy:bounds.y+bounds.height/2,tier:forestLayoutConfig(Model.completed(state,year).length).tier};
}
function forestFittedState(frame){return {scale:frame.fit,x:(360-frame.cx)*frame.fit,y:(270-frame.cy)*frame.fit}}
function initializeForestViewport(frame){
 const previous=forestViewportFrame;
 if(forestViewportYear!==year||!previous||previous.tier!==frame.tier||zoomState.scale<=previous.fit*1.03){zoomState=forestFittedState(frame)}
 else{
  const scale=Math.max(frame.min,Math.min(frame.max,zoomState.scale/previous.fit*frame.fit)),ratio=scale/zoomState.scale;
  zoomState={scale,x:zoomState.x*ratio,y:zoomState.y*ratio};
 }
 forestViewportYear=year;forestViewportFrame=frame;
}

function setupForest(){
 const vp=$('forestViewport'),world=vp?.querySelector('#forest-world');if(!vp||!world)return;
 const pointers=new Map();let prev=null,suppressClick=false,sel=null;


 const SVG_NS='http://www.w3.org/2000/svg',TYPE_LABEL={book:'책',album:'음반',movie:'영화'},TAP_RADIUS=24;
 const tip=document.createElement('button');tip.type='button';tip.className='forest-tree-tooltip';tip.setAttribute('aria-hidden','true');tip.tabIndex=-1;vp.appendChild(tip);

 /* 선택/호버된 나무 발밑 링 — SVG 요소라 iOS Safari에서도 확실히 그려진다(CSS filter 글로우는 SVG 자식에 안 먹는 경우가 있음). */
 const setFocusRing=(g,mode)=>{
  vp.querySelectorAll('.tree-ring').forEach(r=>r.remove());
  vp.querySelectorAll('.is-focus').forEach(x=>x.classList.remove('is-focus'));
  if(!g)return;

async function ocrCached(cache,key,produce,accept=()=>true,onReuse=()=>{}){

   const bytes=JSON.stringify(value).length*2;
   if(bytes<=cache.maxBytes){
    cache.values.set(key,{value:ocrCacheCopy(value),bytes,expires:Date.now()+cache.ttl});
    let total=[...cache.values.values()].reduce((n,v)=>n+v.bytes,0);
    while(cache.values.size>cache.maxEntries||total>cache.maxBytes){const first=cache.values.keys().next().value;total-=cache.values.get(first).bytes;cache.values.delete(first)}

}

function ocrCreateSearchSession(search,isCurrent=()=>true){

  if(stopped||!isCurrent())return;

   const job=queue.shift();job.state='running';active++;stats.peak=Math.max(stats.peak,active);
   if(job.speculative)stats.prefetched++;
   Promise.resolve().then(()=>search(job.query)).then(value=>{
    job.state='done';job.value=value;
    // A failed speculative lookup must not suppress a normal retry.
    if(value.errors?.length)entries.delete(job.key);
    job.resolve(value);
   },error=>{entries.delete(job.key);job.state='failed';job.reject(error)}).finally(()=>{active--;pump()});
  }
 }
 function request(query,speculative){
  const key=keyOf(query),existing=entries.get(key);
  if(existing){if(!speculative&&existing.speculative&&!existing.used){existing.used=true;stats.reused++}return existing.promise}
  if(stopped||!isCurrent())return Promise.reject(Error('인식이 취소되었어요.'));
  const job={query:key,key,speculative,state:'queued',used:!speculative};
  job.promise=new Promise((resolve,reject)=>{job.resolve=resolve;job.reject=reject});
  entries.set(key,job);if(speculative)queue.push(job);else queue.unshift(job);pump();return job.promise;

  while(queue.length){const job=queue.pop();entries.delete(job.key);stats.discarded++;job.reject(Error('추가 사전 검색을 종료했어요.'))}

  offer(queries){
   if(finalPhase||stopped||!isCurrent())return;
   // Speculation only: this budget never filters the final recognition candidates.
   for(const q of [...queries].sort((a,b)=>b.geometryScore-a.geometryScore)){
    if(stats.prefetched+queue.length>=12)break;
    if(!q.creator||q.geometryScore<85)continue;

  },
  stop(){stopped=true;discardQueued()},
  stats

}

const shareCoverCache=new Map();
function shareCoverProxyURL(src){
 // The fallback receives only public catalog artwork, never uploaded photos,
 // arbitrary URLs, account data, or the calendar itself. Keep saved covers intact.
 try{
  const url=new URL(src);
  if(!['http:','https:'].includes(url.protocol)||url.username||url.password||url.port)return '';
  const publicArtwork=u=>
   (/^search\d?\.kakaocdn\.net$/.test(u.hostname)&&u.pathname.startsWith('/thumb/'))||
   (/^t\d\.daumcdn\.net$/.test(u.hostname)&&/^\/lbook\/image\/\d+/.test(u.pathname))||
   (u.hostname==='image.yes24.com'&&u.pathname.startsWith('/goods/'))||
   (u.hostname==='image.aladin.co.kr'&&u.pathname.startsWith('/product/'))||
   (u.hostname==='contents.kyobobook.co.kr'&&u.pathname.startsWith('/sih/'))||
   (['books.google.com','books.google.co.kr','books.googleusercontent.com'].includes(u.hostname)&&u.pathname==='/books/content')||
   (['shopping-phinf.pstatic.net','bookthumb-phinf.pstatic.net'].includes(u.hostname));
  if(!publicArtwork(url)||[...url.searchParams.keys()].some(k=>/token|signature|credential|authorization|key/i.test(k)))return '';
  if(url.searchParams.has('fname')){
   const original=new URL(url.searchParams.get('fname'));
   if(!['http:','https:'].includes(original.protocol)||original.username||original.password||original.port||!/^t\d\.daumcdn\.net$/.test(original.hostname)||!/^\/lbook\/image\/\d+/.test(original.pathname)||[...original.searchParams.keys()].some(k=>k!=='timestamp'))return '';
  }
  url.hash='';
  return 'https://wsrv.nl/?'+new URLSearchParams({url:url.href,w:'240',h:'360',fit:'inside',output:'jpg'});
 }catch{return ''}
}
async function loadShareCover(src,timeoutMs=12000,isCurrent=()=>true){
 if(!src||!isCurrent())return null;

 const started=performance.now(),proxy=shareCoverProxyURL(src);
 let img=await loadShareImage(src,proxy?Math.min(3500,timeoutMs):timeoutMs);
 if(!isCurrent())return null;
 if(!img&&proxy){
  const remaining=timeoutMs-(performance.now()-started);
  if(remaining>0)img=await loadShareImage(proxy,remaining);
 }
 if(!isCurrent())return null;
 if(img){shareCoverCache.set(src,img);if(shareCoverCache.size>64)shareCoverCache.delete(shareCoverCache.keys().next().value)}
 return img;
}

const imeComposingIds=new Set();
let mainSearchRenderTimer=null;
const catalogSearchTimers={book:null,album:null,movie:null};

function catalogKindFromId(id){
 return id==='catalogSearch'?'book':id==='musicCatalogSearch'?'album':id==='movieCatalogSearch'?'movie':'';
}
function cancelCatalogTimer(kind){
 if(!kind)return;
 clearTimeout(catalogSearchTimers[kind]);
 catalogSearchTimers[kind]=null;
 if(kind==='book'){clearTimeout(bookSearchTimer);bookSearchTimer=null}
 if(kind==='album'){clearTimeout(musicSearchTimer);musicSearchTimer=null}
 if(kind==='movie'){clearTimeout(movieSearchTimer);movieSearchTimer=null}
}
function invalidateCatalogRequest(kind){
 if(kind==='book')bookSearchSeq++;
 else if(kind==='album')musicSearchSeq++;
 else if(kind==='movie')movieSearchSeq++;
}
function runCatalogSearch(kind,value){
 if(kind==='book')searchResults(value);
 else if(kind==='album')musicSearchResults(value);
 else if(kind==='movie')movieSearchResults(value);
}
function scheduleCatalogSearchFromLiveInput(input,delay=460){
 const id=input?.id,kind=catalogKindFromId(id);
 if(!kind)return;
 if(scrapFlowActive)scrapComposerState.queries[kind]=input.value;
 cancelCatalogTimer(kind);

 catalogSearchTimers[kind]=setTimeout(()=>{
  catalogSearchTimers[kind]=null;
  const current=document.getElementById(id);
  if(!current)return;

  // Windows/Chromium can keep the final Hangul syllable in composition
  // until another key is pressed. So do not wait for compositionend here.
  const value=current.value;
  if(scrapFlowActive)scrapComposerState.queries[kind]=value;
  runCatalogSearch(kind,value);
 },delay);
}

function scheduleMainSearchRender(input){
 const q=input.value,position=input.selectionStart??q.length;
 activeScrapFilters().q=q;if(!picking)persist();
 clearTimeout(mainSearchRenderTimer);
 mainSearchRenderTimer=setTimeout(()=>{
  mainSearchRenderTimer=null;
  if(imeComposingIds.has('search'))return;
  const current=$('search');
  if(current&&document.activeElement===current&&current.value!==q)return;
  if(view!=='scrap'||modal)return;
  const scroll=window.scrollY;
  render();
  const next=$('search');
  if(next){
   next.focus();
   try{next.setSelectionRange(Math.min(position,next.value.length),Math.min(position,next.value.length))}catch{}
  }
  window.scrollTo(0,scroll);
 },480);
}

document.addEventListener('compositionstart',e=>{
 const input=e.target,id=input?.id;
 if(!['search','catalogSearch','musicCatalogSearch','movieCatalogSearch'].includes(id))return;
 imeComposingIds.add(id);

 if(id==='search'){
  clearTimeout(mainSearchRenderTimer);
  mainSearchRenderTimer=null;
  return;
 }

 const kind=catalogKindFromId(id);
 invalidateCatalogRequest(kind);
 cancelCatalogTimer(kind);
});

document.addEventListener('compositionend',e=>{
 const id=e.target?.id;
 if(!['search','catalogSearch','musicCatalogSearch','movieCatalogSearch'].includes(id))return;
 imeComposingIds.delete(id);

 setTimeout(()=>{
  const current=document.getElementById(id);
  if(!current)return;
  if(id==='search')scheduleMainSearchRender(current);
  else scheduleCatalogSearchFromLiveInput(current,80);
 },0);
});

document.addEventListener('input',e=>{
 const input=e.target,id=input?.id;
 if(!['search','catalogSearch','musicCatalogSearch','movieCatalogSearch'].includes(id))return;

 if(id==='search'){
  activeScrapFilters().q=input.value;if(!picking)persist();
  if(e.isComposing||imeComposingIds.has(id))return;
  scheduleMainSearchRender(input);
  return;
 }

 const kind=catalogKindFromId(id);
 invalidateCatalogRequest(kind);

 // Always schedule from the latest visible text, even while composing.
 // Search result rendering does not replace the catalog input node.
 scheduleCatalogSearchFromLiveInput(input,460);
});

}

}

const TASTE_EXPLORE={

};
let tasteLoading=false,tasteNotice='',tasteRequest=0,tasteOwner=null;
let tasteActiveCandidate=null;
let tasteShownKeys=new Set(),tasteQueryDecks={},tasteExploreDecks={},tasteUsedQueries=new Set();
function enqueueTasteQuery(type,query){
 const key=type+':'+Model.norm(query);
 if(!Model.norm(query)||tasteUsedQueries.has(key))return;
 tasteUsedQueries.add(key);tasteExploreDecks[type].push(query);
}
function tasteKeys(c){
 const keys=[c.type+':text:'+Model.norm(c.title)+':'+Model.norm(c.creator)];
 if(c.recommendationKey)keys.push(c.recommendationKey);
 const providerId=String(c.providerId??c.provider_id??'').trim();
 if(providerId)keys.push(c.type+':id:'+(c.provider||'')+':'+providerId);
 if(c.type==='book'){
  const isbns=String(c.isbn||'').replace(/-/g,'').match(/(?:97[89]\d{10}|\d{9}[\dXx])/g)||[];
  isbns.forEach(isbn=>keys.push('book:isbn:'+isbn.toUpperCase()));
 }
 return keys;
}
function isTasteCandidateSaved(c){
 const keys=new Set(tasteKeys(c));
 return state.items.some(item=>tasteKeys(item).some(key=>keys.has(key)));
}
function hasTasteHistory(c){
 const history=new Set(state.profile.recommendationHistory||[]);
 return tasteKeys(c).some(key=>history.has(key))||!!state.profile.responses?.[c.type+':'+c.title];
}
function rememberTasteCandidate(c){
 const history=new Set(state.profile.recommendationHistory||[]),before=history.size;
 tasteKeys(c).forEach(key=>history.add(key));
 if(history.size!==before){state.profile.recommendationHistory=[...history];persist()}
}
function freshTasteCandidates(candidates){
 const excluded=new Set([...tasteShownKeys,...(state.profile.recommendationHistory||[])]);
 [...state.items,...tastePool.slice(tasteIndex)].forEach(c=>{
  tasteKeys(c).forEach(key=>excluded.add(key));
 });
 return candidates.filter(c=>{
  if(!c?.title||!['book','album','movie'].includes(c.type)||state.profile.responses?.[c.type+':'+c.title])return false;
  if(!allowDiscoveryCandidate(c))return false;
  const keys=tasteKeys(c);
  if(keys.some(key=>excluded.has(key)))return false;
  keys.forEach(key=>excluded.add(key));return true;
 });
}

function tasteSignalCount(type){
 const responses=state.profile?.responses||{};
 let count=Object.keys(responses).filter(k=>k.startsWith(type+':')&&['interested','experienced'].includes(responses[k])).length;
 count+=state.items.filter(c=>c.type===type&&(c.completed||c.saves?.length)).length*.35;
 return count;
}
function tastePopularityScore(c){
 const pop=Math.max(0,Number(c?.searchPopularity)||0),rating=Math.max(0,Number(c?.averageRating)||0),votes=Math.max(0,Number(c?.voteCount)||0);
 let score=0;
 if(c.type==='book'){
  score=Math.max(score,.18+bookPublisherTrust(c)*.22+bookEditionTrust(c)*.16);

  const yesPop=Math.max(0,Number(c?.yes24PopularityScore)||0);
  const salePoint=Math.max(0,Number(c?.yes24SalePoint)||0);
  const star=Math.max(0,Number(c?.yes24StarScore)||0);

  if(yesPop>0)score=Math.max(score,Math.min(1,.34+yesPop/190));
  if(salePoint>0)score=Math.max(score,Math.min(1,.32+Math.log10(salePoint+1)/5.2));
  if(c?.yes24BestsellerRank)score=Math.max(score,Math.max(.62,1-Math.log10(Number(c.yes24BestsellerRank)+1)*.14));
  if(c?.yes24SteadyRank)score=Math.max(score,Math.max(.40,.88-Math.log10(Number(c.yes24SteadyRank)+1)*.15));
  if(star>0)score=Math.min(1,score+Math.min(.08,star/120));
  if(c?.yes24Found)score=Math.min(1,score+.03);

  if(pop>0)score=Math.max(score,Math.min(1,.36+Math.log10(pop+1)/4.8));
 }else if(c.type==='movie'){
  if(pop>0)score=Math.max(score,Math.min(1,.34+Math.log10(pop+1)/4.2));
  if(votes>0)score=Math.max(score,Math.min(1,.30+Math.log10(votes+1)/5.1));
 }else{
  if(pop>0)score=Math.max(score,Math.min(1,.34+Math.log10(pop+1)/5));
 }
 if(rating>0&&(c.type!=='movie'||votes>=100))score=Math.min(1,score+Math.min(.10,rating/100));
 if(c.cover)score=Math.min(1,score+.03);
 return Math.max(.18,score);
}
function tasteAffinityScore(c){
 const same=state.items.filter(x=>x.type===c.type);
 if(!same.length)return .35;
 let score=.20,weight=0;
 for(const x of same){
  const positive=x.completed||x.saves?.length||state.profile?.responses?.[x.type+':'+x.title]==='interested'||state.profile?.responses?.[x.type+':'+x.title]==='experienced';
  if(!positive)continue;
  weight++;
  if(c.genre&&x.genre&&Model.norm(c.genre)===Model.norm(x.genre))score+=.22;
  if(c.creator&&x.creator&&Model.norm(c.creator)===Model.norm(x.creator))score+=.10;
  const cg=new Set((c.genreCandidates||[]).map(g=>Model.norm(Array.isArray(g)?g[0]:g)));
  const xg=(x.genreCandidates||[]).map(g=>Model.norm(Array.isArray(g)?g[0]:g));
  if(xg.some(g=>cg.has(g)))score+=.08;
 }
 return Math.max(.15,Math.min(1,score/(Math.max(1,weight*.16)+.55)));
}
function tasteDiversityScore(c){
 const recent=tastePool.slice(Math.max(0,tasteIndex-8),tasteIndex).filter(Boolean);
 if(!recent.length)return 1;
 let penalty=0;
 for(const x of recent){
  if(c.creator&&x.creator&&Model.norm(c.creator)===Model.norm(x.creator))penalty+=.34;
  if(c.genre&&x.genre&&Model.norm(c.genre)===Model.norm(x.genre))penalty+=.07;
  if(c.type==='movie'&&c.providerId&&x.providerId===c.providerId)penalty+=1;
 }
 return Math.max(0,1-penalty);
}

function tasteRecencyScore(c){
 const raw=String(c?.publishedAt||c?.publishDate||c?.releaseDate||'').trim();
 if(!raw)return .12;

 let year=0,month=1,day=1;
 const compact=raw.match(/^(\d{4})(\d{2})(\d{2})$/);
 const dashed=raw.match(/^(\d{4})[-/.](\d{1,2})(?:[-/.](\d{1,2}))?/);

 if(compact){
  year=Number(compact[1]);month=Number(compact[2]);day=Number(compact[3]);
 }else if(dashed){
  year=Number(dashed[1]);month=Number(dashed[2]);day=Number(dashed[3]||1);
 }else{
  const y=raw.match(/\b(19|20)\d{2}\b/);
  if(y)year=Number(y[0]);
 }

 if(!year)return .12;

 const now=new Date();
 const published=new Date(year,Math.max(0,month-1),Math.max(1,day));
 const ageYears=Math.max(0,(now-published)/(365.25*24*60*60*1000));

 // Fresh releases are strongly preferred during cold start, but backlist
 // titles keep a non-zero floor so classics can still appear.
 if(ageYears<=1.5)return 1;
 if(ageYears<=3)return .86;
 if(ageYears<=5)return .68;
 if(ageYears<=8)return .46;
 if(ageYears<=12)return .30;
 return .12;
}

function tasteRankScore(c){
 const signals=tasteSignalCount(c.type);

 // Cold start policy:
 // books: current YES24 bestsellers first (weighted random), then popularity/newness.
 // other media: recent releases + popular titles.
 // As explicit taste accumulates, affinity gradually becomes the main signal.
 const weights=c.type==='book'
  ?(signals<3
    ?{pop:.70,newness:.18,aff:.04,div:.08}
    :signals<8
     ?{pop:.62,newness:.14,aff:.10,div:.14}
     :{pop:.54,newness:.10,aff:.20,div:.16})
  :(signals<3
    ?{pop:.52,newness:.28,aff:.10,div:.10}
    :signals<8
     ?{pop:.40,newness:.18,aff:.28,div:.14}
     :{pop:.36,newness:.08,aff:.40,div:.16});

 const pop=tastePopularityScore(c),
       newness=tasteRecencyScore(c),
       aff=tasteAffinityScore(c),
       div=tasteDiversityScore(c);

 // Current bestseller status gets an extra cold-start nudge for books.
 let bestsellerNudge=0;
 if(c.type==='book'&&signals<3){
  if(c?.yes24BestsellerRank)bestsellerNudge=.10;
  else if((Number(c?.yes24PopularityScore)||0)>0)bestsellerNudge=.04;
 }

 const stableJitter=(hash(c.type+'|'+c.title+'|'+c.creator)%100)/10000;
 return pop*weights.pop
      +newness*weights.newness
      +aff*weights.aff
      +div*weights.div
      +bestsellerNudge
      +stableJitter;
}
function rankTasteCandidates(candidates){
 return [...candidates].sort((a,b)=>tasteRankScore(b)-tasteRankScore(a));
}

function nextTasteQuery(type){
 if(type==='album')return {pick:['classic-albums',''],curated:false};
 const query=tasteExploreDecks[type].shift();
 return query?{pick:[query,''],curated:false}:null;
}


const BOOK_RECOMMENDATION_EXCLUDED_GROUPS=new Set(['history','art','travel','selfdev','society','economy']);

const BOOK_RECOMMENDATION_YOUTH_RE=/(주니어|어린이|아동|유아|청소년|키즈|초등|중등|고등|학습만화|만화로\s*배우는|캐릭터|공략집)/i;
const BOOK_RECOMMENDATION_YOUTH_PUBLISHER_RE=/(주니어|어린이|아이세움|아울북|비룡소|사계절아동|웅진주니어|길벗스쿨|미래엔아이세움|위즈덤하우스\s*키즈|키즈엠|창비어린이|다산어린이)/i;

function isYouthBookRecommendationCandidate(c){
 const title=String(c?.title||'');
 const publisher=String(c?.publisher||'');
 const categoryText=[
  c?.genre,
  c?.rawGenre,
  c?.categoryName,
  c?.categoryFullPath
 ].filter(Boolean).join(' ');
 return BOOK_RECOMMENDATION_YOUTH_RE.test(title)
   ||BOOK_RECOMMENDATION_YOUTH_RE.test(categoryText)
   ||BOOK_RECOMMENDATION_YOUTH_PUBLISHER_RE.test(publisher);
}


async function fetchBookRankingCandidates(mode='bestseller'){
 const controller=new AbortController();
 const timer=setTimeout(()=>controller.abort(),7000);
 try{
  const res=await fetch(BOOK_POPULARITY_ENDPOINT,{
   method:'POST',
   headers:{'Content-Type':'application/json','Accept':'application/json'},
   body:JSON.stringify({mode,page:1,size:100}),
   signal:controller.signal
  });
  if(!res.ok)return [];

  const payload=await res.json();
  const raw=Array.isArray(payload?.books)?payload.books:[];
  return raw.map((d,index)=>{
   const title=String(d?.title||'').trim();
   const creator=String(d?.author||d?.creator||'').trim();
   const isbn13=String(d?.isbn13||d?.isbn||'').replace(/\D/g,'');
   const publishedAt=String(d?.publishDate||d?.publishedAt||'').trim();
   const rank=Number(d?.rank)||index+1;

   // 카테고리별 rank 기준. 상위권일수록 잘 뽑히되 완전 순차는 아니다.
   const rankingWeight=mode==='steady'
    ?(rank<=5?.72:rank<=10?.60:rank<=20?.48:.36)
    :(rank<=5?1:rank<=10?.86:rank<=20?.68:.48);

   return {
    type:'book',
    title,
    creator,
    publisher:String(d?.publisher||'').trim(),
    isbn:isbn13,
    cover:String(d?.cover||'').trim(),
    catalogUrl:String(d?.link||'').trim(),
    publishedAt,
    genre:String(d?.categoryName||'').trim(),
    rawGenre:String(d?.categoryFullPath||'').trim(),
    genreSource:'yes24-'+mode,
    genreCandidates:[],
    recommendationGroup:String(d?.recommendationGroup||'etc'),
    categoryName:String(d?.categoryName||'').trim(),
    source:mode==='steady'?'YES24 스테디셀러':'YES24 베스트셀러',
    yes24Found:true,
    yes24PopularityScore:Number(d?.popularityScore)||0,
    yes24SalePoint:Number(d?.salePoint)||0,
    yes24StarScore:Number(d?.starScore)||0,
    yes24BestsellerRank:mode==='bestseller'?rank:null,
    yes24SteadyRank:mode==='steady'?rank:(Number(d?.steadyRank)||null),
    bestsellerWeight:rankingWeight,
    recommendationTier:mode
   };
  }).filter(c=>
    c.title
    &&!isExcludedBookCandidate(c)
    &&!BOOK_RECOMMENDATION_EXCLUDED_GROUPS.has(String(c?.recommendationGroup||''))
    &&!isYouthBookRecommendationCandidate(c)
   );
 }catch{
  return [];
 }finally{
  clearTimeout(timer);
 }
}
function weightedPickIndex(list){
 const total=list.reduce((sum,c)=>sum+Math.max(.05,Number(c?.bestsellerWeight)||.35),0);
 let pick=Math.random()*total;
 for(let i=0;i<list.length;i++){
  pick-=Math.max(.05,Number(list[i]?.bestsellerWeight)||.35);
  if(pick<=0)return i;
 }
 return Math.max(0,list.length-1);
}

function weightedShuffleBestsellers(list){
 // 같은 장르가 연속으로 몰리지 않게 카테고리별로 번갈아 뽑는다.
 const groups=new Map();
 for(const c of (list||[])){
  const key=String(c?.recommendationGroup||c?.categoryName||'etc');
  if(!groups.has(key))groups.set(key,[]);
  groups.get(key).push(c);
 }
 const groupKeys=[...groups.keys()].sort(()=>Math.random()-.5);
 const out=[];
 while(groupKeys.some(key=>(groups.get(key)||[]).length)){
  // 라운드마다 카테고리 순서를 가볍게 섞어서 고정 패턴도 피한다.
  const round=[...groupKeys].sort(()=>Math.random()-.5);
  for(const key of round){
   const pool=groups.get(key)||[];
   if(!pool.length)continue;
   const idx=weightedPickIndex(pool);
   out.push(pool.splice(idx,1)[0]);
  }
 }
 return out;
}

function musicRecommendationWeight(c){
 const users=Math.max(0,Number(c?.totalUserCount)||0);
 const listens=Math.max(0,Number(c?.totalListenCount)||0);
 const score=Math.max(0,Number(c?.musicPopularityScore)||0);
 return Math.max(.2,score||Math.log10(users+1)*.78+Math.log10(listens+1)*.22);
}

function weightedShuffleClassicAlbums(list){
 const pool=[...(list||[])];
 const out=[];
 const usedArtists=new Set();
 let recentGenres=[],recentEras=[];

 while(pool.length){
  const candidates=pool
   .map((c,i)=>({c,i}))
   .filter(({c})=>!usedArtists.has(Model.norm(c?.creator||'')));

  if(!candidates.length)break;

  const weighted=candidates.map(({c,i})=>{
   let w=musicRecommendationWeight(c);
   const genre=String(c?.musicGenreFamily||c?.genre||'').toLowerCase();
   const era=String(c?.musicEra||'');
   if(genre&&recentGenres.includes(genre))w*=.32;
   if(genre&&recentGenres.slice(-1)[0]===genre)w*=.18;
   if(era&&recentEras.slice(-2).includes(era))w*=.68;
   w*=.82+Math.random()*.36;
   return {c,i,w:Math.max(.03,w)};
  });

  const total=weighted.reduce((s,x)=>s+x.w,0);
  let pick=Math.random()*total,chosen=weighted[0];
  for(const x of weighted){
   pick-=x.w;
   if(pick<=0){chosen=x;break}
  }

  const [picked]=pool.splice(chosen.i,1);
  out.push(picked);
  usedArtists.add(Model.norm(picked?.creator||''));

  const g=String(picked?.musicGenreFamily||picked?.genre||'').toLowerCase();
  const e=String(picked?.musicEra||'');
  if(g)recentGenres=[...recentGenres.slice(-2),g];
  if(e)recentEras=[...recentEras.slice(-2),e];
 }
 return out;
}

// Public catalog only: saved works and responses are filtered at display time.
const MUSIC_CATALOG_TTL=30*60*1000;
let musicClassicCatalog=[],musicClassicFetchedAt=0,musicClassicRequest=null;
function loadMusicClassicCatalog(){
 if(musicClassicFetchedAt&&Date.now()-musicClassicFetchedAt<MUSIC_CATALOG_TTL)return Promise.resolve(musicClassicCatalog);
 if(musicClassicRequest)return musicClassicRequest;
 musicClassicRequest=requestMusicClassicCatalog().then(candidates=>{
  if(candidates.length){musicClassicCatalog=candidates;musicClassicFetchedAt=Date.now()}
  return musicClassicCatalog;
 }).finally(()=>{musicClassicRequest=null});
 return musicClassicRequest;
}
async function fetchMusicClassicCandidates(){
 return weightedShuffleClassicAlbums(await loadMusicClassicCatalog());
}

async function fetchTasteCandidates(type,job){
 if(type==='movie'){
  return await fetchMovieRecommendations();
 }
 if(type==='book'){
  const bestsellers=await fetchBookRankingCandidates('bestseller');
  return weightedShuffleBestsellers(bestsellers);
 }
 if(type==='album'){
  return await fetchMusicClassicCandidates();
 }
 if(!job)return [];
 const {pick}=job;
 const [title,creator]=pick;
 const query=title+(creator?' '+creator:'');
 const config={book:[BOOK_SEARCH_ENDPOINT,unwrapBookDocuments,normalizeRemoteBook],album:[MUSIC_SEARCH_ENDPOINT,unwrapAlbums,normalizeRemoteAlbum],movie:[MOVIE_SEARCH_ENDPOINT,unwrapMovies,normalizeRemoteMovie]};
 const [endpoint,unwrap,normalize]=config[type];
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),7000);
 try{
  const url=type==='book'?endpoint+'?query='+encodeURIComponent(query)+'&q='+encodeURIComponent(query):endpoint;
  const headers={'Content-Type':'application/json','Accept':'application/json'};
  if(cloudSession?.access_token)headers.Authorization='Bearer '+cloudSession.access_token;
  const publicKey=cloudPublicKey();if(publicKey)headers.apikey=publicKey;
  const res=await fetch(url,{method:'POST',headers,body:JSON.stringify({query,q:query,size:50,page:1}),signal:controller.signal});
  if(!res.ok)throw Error('HTTP '+res.status);
  let works=unwrap(await res.json()).map(normalize).filter(c=>c.title&&(type!=='book'||!isExcludedBookCandidate(c)));
  if(type==='movie')works=[...works].sort((a,b)=>movieSearchScore(b,query)-movieSearchScore(a,query));
  if(type==='book')return works.slice(0,40);
  return works.slice(0,24);
 }finally{clearTimeout(timer)}
}

async function enrichTasteBookPopularity(candidates){
 const books=(candidates||[])
   .filter(c=>c?.type==='book'&&!isExcludedBookCandidate(c)&&primaryIsbn13(c?.isbn))
   .slice(0,12);
 const isbns=[...new Set(books.map(c=>primaryIsbn13(c.isbn)).filter(Boolean))];
 if(!isbns.length)return candidates;

 const controller=new AbortController();
 const timer=setTimeout(()=>controller.abort(),4500);

 try{
  const res=await fetch(BOOK_POPULARITY_ENDPOINT,{
   method:'POST',
   headers:{'Content-Type':'application/json','Accept':'application/json'},
   body:JSON.stringify({isbns}),
   signal:controller.signal
  });
  if(!res.ok)return candidates;

  const payload=await res.json();
  const responseBooks = Array.isArray(payload?.books)
    ? payload.books
    : (payload?.isbn ? [payload] : []);

  const infoMap=new Map(
   responseBooks
    .map(info=>[primaryIsbn13(info?.isbn13||info?.isbn),info])
    .filter(([isbn])=>isbn)
  );

  for(const book of books){
   const info=infoMap.get(primaryIsbn13(book.isbn));
   if(info)applyPopularityInfo(book,info);
  }
 }catch{
  // YES24 보강이 실패하거나 느려도 추천 자체는 서버 후보로 계속 진행한다.
 }finally{
  clearTimeout(timer);
 }

 return candidates;
}

async function loadTasteCandidates(){
 if(tasteLoading)return;
 const request=++tasteRequest,owner=cloudSession?.user?.id||'local';
 tasteLoading=true;tasteNotice='';render();
 try{
 // Prefetch without replacing the current card. Limit empty/error retries per interaction.
 for(let attempt=0;attempt<(tastePreferredType==='album'?1:2);attempt++){
  const activeTypes=tastePreferredType?[tastePreferredType]:['book','album','movie'];
  const jobs=activeTypes.map(type=>({type,job:nextTasteQuery(type)})).filter(x=>x.job);
  if(!jobs.length){
   if(tasteMode==='add'){
    const refillTypes=tastePreferredType?[tastePreferredType]:['book','album','movie'];
    for(const type of refillTypes){tasteExploreDecks[type]=[];TASTE_EXPLORE[type].forEach(q=>{const key=type+':'+Model.norm(q);tasteUsedQueries.delete(key);enqueueTasteQuery(type,q)})}
    continue;
   }
   tasteNotice='지금 찾을 수 있는 새 작품을 모두 살펴봤어요.';break
  }
  const results=await Promise.allSettled(jobs.map(({type,job})=>fetchTasteCandidates(type,job)));
  if(request!==tasteRequest)return;
  if(owner!==(cloudSession?.user?.id||'local')||authRoute!=='taste'){tasteLoading=false;return}
  let candidates=results.flatMap(r=>r.status==='fulfilled'?r.value:[])
   .filter(c=>c?.type!=='book'||!isExcludedBookCandidate(c));

  // Book recommendations get the same YES24 popularity enrichment as search.
  candidates=await enrichTasteBookPopularity(candidates);

  // Filter educational/anthology books again before the final recommendation rank.
  candidates=candidates.filter(c=>c?.type!=='book'||!isExcludedBookCandidate(c));

  // 책은 서버의 카테고리 혼합 베스트셀러 순서를 보존한다.
  // 장르/취향 점수로 다시 정렬하면 특정 장르가 몰릴 수 있으므로 책에는 재정렬하지 않는다.
  let additions;
  if(tastePreferredType==='book' || (candidates.length&&candidates.every(c=>c?.type==='book'))){
   additions=freshTasteCandidates(candidates);
   if(!additions.length){
    const steady=await fetchTasteBookSteadyFallback();
    additions=freshTasteCandidates(steady);
   }
  }else if(tastePreferredType==='album' || (candidates.length&&candidates.every(c=>c?.type==='album'))){
   // 음악은 ListenBrainz 대중성 + 장르/시대 분산 순서를 그대로 사용한다.
   additions=freshTasteCandidates(candidates);
  }else{
   additions=rankTasteCandidates(freshTasteCandidates(candidates));
  }
  if(request!==tasteRequest)return;
  if(owner!==(cloudSession?.user?.id||'local')||authRoute!=='taste'){tasteLoading=false;return}
  tastePool.push(...additions);
  const failed=results.filter(r=>r.status==='rejected').length;
  if(failed===results.length){
   jobs.forEach(({type,job})=>{if(job?.pick?.[0])tasteExploreDecks[type].push(job.pick[0])});
   tasteNotice='작품을 불러오지 못했어요. 연결을 확인하고 다시 시도해주세요.';break;
  }
  if(additions.length)break;
 }
 if(!tastePool[tasteIndex]&&!tasteNotice)tasteNotice='새 작품을 찾지 못했어요. 다른 후보를 다시 찾아볼 수 있어요.';
 tasteLoading=false;
 render();
 }catch(err){
  if(request===tasteRequest){
   tasteLoading=false;
   tasteNotice='추천을 불러오는 중 오류가 발생했어요. 다시 시도해주세요.';
   console.error('taste recommendation error',err);
   render();
  }
 }
}
function startTaste(mode='initial',preferredType=''){
 tasteMode=mode==='add'?'add':'initial';
 if(preferredType&&['book','album','movie'].includes(preferredType))tastePreferredType=preferredType;
 // Keep skipped works out of subsequent batches during this account's page session.
 const owner=cloudSession?.user?.id||'local';
 if(tasteOwner!==owner){
  tasteShownKeys=new Set();tasteQueryDecks={};tasteExploreDecks={};tasteUsedQueries=new Set();tasteOwner=owner;
  for(const type of ['book','album','movie']){
   tasteQueryDecks[type]=[];tasteExploreDecks[type]=[];
   TASTE_EXPLORE[type].forEach(query=>enqueueTasteQuery(type,query));
  }
 }
 tasteActiveCandidate=null;
 tasteRequest++;tasteLoading=false;tastePool=[];tasteIndex=0;tasteSeen=0;tasteReviewed=0;
 flowTo('taste');
 return loadTasteCandidates();
}

function tasteIntroText(c){
 let raw=String(c?.contents||c?.description||c?.overview||'')
  .replace(/<[^>]+>/g,' ')
  .replace(/[_＿]+/g,' ')
  .replace(/\s+/g,' ')
  .trim();
 if(!raw)return '';

 // 추천사/인용문/수상·화제 문구보다 실제 작품 설명을 우선한다.
 raw=raw
  .replace(/^[“"『「][^”"』」]{15,220}[”"』」]\s*(?:[-–—]?\s*[^.!?。]{0,45})?\s*/,'')
  .replace(/^(?:(?:출간\s*즉시|종합\s*베스트셀러|베스트셀러|유튜브\s*[\d,.]+\s*만?\s*뷰|전\s*국민적|화제작|특별기획보도|인터뷰\s*대서특필|방송계의\s*퓰리처상|피버디상|수상자|수상작|추천사|찬사)[^.!?。]{0,95}[.!?。]?\s*)+/i,'')
  .trim();

 if(!raw)return '';

 // 첫 문장이 너무 짧으면 거기서 끝내지 않는다.
 // 완결된 문장을 2~3개 이어 붙여 약 90~170자 정도를 목표로 한다.
 const parts=[];
 let start=0;
 const enders=/[.!?。]/g;
 let match;
 while((match=enders.exec(raw))&&parts.length<4){
  let end=match.index+1;
  while(end<raw.length&&/[”"'’」』)]/.test(raw[end]))end++;
  const part=raw.slice(start,end).trim();
  if(part)parts.push(part);
  start=end;
  while(start<raw.length&&/\s/.test(raw[start]))start++;
  enders.lastIndex=start;
 }

 if(parts.length){
  let combined='';
  for(const part of parts){
   const next=(combined?combined+' ':'')+part;
   if(combined.length>=90)break;
   if(next.length<=180){
    combined=next;
   }else{
    break;
   }
  }
  if(combined.length>=70)return combined;
 }

 // 문장부호가 드문 소개문은 단어 경계에서만 축약한다.
 if(raw.length<=165)return raw;
 const probe=raw.slice(0,166);
 const lastSpace=probe.lastIndexOf(' ');
 const safe=lastSpace>=135?probe.slice(0,lastSpace):raw.slice(0,160);
 return safe.trim()+'…';
}

async function ensureTasteIntro(c){
 if(!c||c.type!=='book'||c.contents||c._introLoading||c._introLoaded)return;
 c._introLoading=true;
 try{
  const isbn=primaryIsbn13(c.isbn);
  const query=isbn||c.title;
  if(!query)return;
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),4500);
  try{
   const url=BOOK_SEARCH_ENDPOINT+'?query='+encodeURIComponent(query)+'&q='+encodeURIComponent(query)+(isbn?'&target=isbn':'');
   const headers={'Content-Type':'application/json','Accept':'application/json'};
   if(cloudSession?.access_token)headers.Authorization='Bearer '+cloudSession.access_token;
   const publicKey=cloudPublicKey();if(publicKey)headers.apikey=publicKey;
   const res=await fetch(url,{
    method:'POST',
    headers,
    body:JSON.stringify({query,q:query,target:isbn?'isbn':'title',size:8,page:1,sort:'accuracy'}),
    signal:controller.signal
   });
   if(!res.ok)return;
   const docs=unwrapBookDocuments(await res.json()).map(normalizeRemoteBook);
   const exact=isbn
    ?docs.find(x=>primaryIsbn13(x.isbn)===isbn)
    :docs.find(x=>Model.norm(x.title)===Model.norm(c.title));
   const found=exact||docs[0];
   if(found?.contents)c.contents=found.contents;
  }finally{
   clearTimeout(timer);
  }
 }catch{
  // 소개 보강 실패는 추천 흐름을 막지 않는다.
 }finally{
  c._introLoading=false;
  c._introLoaded=true;
  if(authRoute==='taste'&&window.tasteCandidate===c)render();
 }
}

// 카카오 책 검색의 contents는 책 소개 전문이 아니라 고정 길이 발췌라서
// 말줄임표 없이 문장 중간에서 끊긴다. 상세 화면에서만 Google Books 원문으로 보강한다.
function looksTruncatedIntro(value){
 const s=String(value||'').trim();
 if(s.length<150)return false;
 return !/(?:[.!?。…”"』」)\]]|다|요|음|임)$/.test(s);
}
// Google Books는 API 키 없이 쓰면 요청 한도가 낮아 429(Too Many Requests)가 쉽게 뜬다.
// 재시도는 오히려 같은 한도를 더 빨리 소진시키므로, 한 번 막히면 곧바로 길게 쉬고
// 그 안에서는 아예 요청을 보내지 않는다. 가장 확실한 해결책은 GOOGLE_BOOKS_API_KEY 발급이다.
let googleBooksCooldownUntil=0;
async function queryGoogleBooksDescription(q,tn,an,timeoutMs){
 if(Date.now()<googleBooksCooldownUntil){
  console.debug('[송림 소개보강] 쿨다운 중이라 요청 생략',q);
  return '';
 }
 const controller=new AbortController();
 const timer=setTimeout(()=>controller.abort(),timeoutMs);
 try{
  const url='https://www.googleapis.com/books/v1/volumes?q='+encodeURIComponent(q)+'&maxResults=5&printType=books'+(GOOGLE_BOOKS_API_KEY?'&key='+GOOGLE_BOOKS_API_KEY:'');
  const res=await fetch(url,{signal:controller.signal});
  if(res.status===429){
   console.debug('[송림 소개보강] 429 응답 - 5분간 요청 중단',q);
   googleBooksCooldownUntil=Date.now()+300000;
   return '';
  }
  if(!res.ok)return '';
  const payload=await res.json(),items=Array.isArray(payload?.items)?payload.items:[];
  if(!items.length)return '';
  const ranked=items.map(it=>{
   const v=it?.volumeInfo||{},vt=Model.norm(v.title||''),va=Model.norm((v.authors||[]).join(' '));
   let score=0;
   if(tn&&vt===tn)score+=10;else if(tn&&(vt.includes(tn)||tn.includes(vt)))score+=6;
   if(an&&va.includes(an))score+=4;
   if(v.description)score+=3;
   return {v,score};
  }).sort((a,b)=>b.score-a.score);
  const best=ranked.find(r=>r.v.description)||ranked[0];
  return String(best?.v?.description||'').replace(/<[^>]+>/g,' ').replace(/\s+\n/g,'\n').trim();
 }catch{
  return '';
 }finally{
  clearTimeout(timer);
 }
}

async function fetchYes24BookDescription(c){
 try{
  const isbn=primaryIsbn13(c?.isbn)||String(c?.isbn||'').split(/\s+/).filter(Boolean)[0]||'';
  if(!isbn)return '';
  const res=await fetch('https://gytfefnvpqqxveryhopw.supabase.co/functions/v1/book-intro',{
   method:'POST',
   headers:{'Content-Type':'application/json'},
   body:JSON.stringify({isbn})
  });
  if(!res.ok)return '';
  const data=await res.json();
  return String(data?.intro||'').trim();
 }catch(e){
  console.debug('[송림 YES24 소개보강] 실패',c?.title,e);
  return '';
 }
}

async function fetchGoogleBookDescription(c){
 const isbn=primaryIsbn13(c?.isbn)||String(c?.isbn||'').split(/\s+/).filter(Boolean)[0]||'';
 const title=String(c?.title||'').replace(/<[^>]+>/g,'').trim();
 const author=String(c?.creator||'').split(',')[0].trim();
 if(!isbn&&!title)return '';
 const tn=Model.norm(title),an=Model.norm(author);
 // ISBN 검색은 정확한 판(版)을 찾지만, 국내서는 Google Books에 등록돼 있어도
 // description이 비어있는 경우가 흔하다. 요청 수를 아끼기 위해 순차로 시도하고,
 // ISBN 쪽에서 이미 설명을 찾으면 제목 검색은 생략한다.
 if(isbn){
  const byIsbn=await queryGoogleBooksDescription('isbn:'+isbn,tn,an,4500);
  if(byIsbn)return byIsbn;
 }
 if(title)return await queryGoogleBooksDescription('intitle:'+title+(author?' inauthor:'+author:''),tn,an,4500);
 return '';
}
async function ensureDetailIntro(c){
 if(!c||c.type!=='book')return;
 const key=detailIntroKey(c);
 if(detailIntroAttempts.has(key))return;
 if(c.contents&&!looksTruncatedIntro(c.contents))return;
 detailIntroAttempts.set(key,'loading');
 try{
  const yes24Description=await fetchYes24BookDescription(c);
  const description=yes24Description || await fetchGoogleBookDescription(c);
  if(description&&description.length>String(c.contents||'').length){
   console.debug('[송림 소개보강] 성공',c.title,'길이',String(c.contents||'').length,'→',description.length);
   c.contents=description;
   if(c.id&&get(c.id)===c)persist();
   if(view==='detail')render();
  }else{
   console.debug('[송림 소개보강] Google Books에 더 나은 소개가 없음',c.title,c.isbn);
  }
 }catch(e){
  console.debug('[송림 소개보강] 실패',c.title,e);
  // 소개 보강 실패는 상세 화면 표시를 막지 않는다.
 }finally{
  detailIntroAttempts.set(key,'done');
 }
}
