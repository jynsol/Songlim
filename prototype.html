function overrideBookGenre(title){

 const override=overrideBookGenre(title);if(override)return override;
 let best='',bestScore=0;
 for(const [name,res] of BOOK_GENRE_RULES){let score=0;for(const re of res){re.lastIndex=0;if(re.test(title))score+=5;re.lastIndex=0;if(re.test(body))score+=3;re.lastIndex=0}if(score>bestScore){best=name;bestScore=score}}
 if(bestScore>=3)return best;
 const narrative=(body.match(/주인공|등장인물|장편|단편|작가의\s*데뷔작|소설가|이야기의\s*배경|서사|허구/g)||[]).length;

}

  if(!cloudSession?.access_token){
   authSession.signedIn=false;
   authRoute='welcome';
   saveSession();
   return;
  }

  authSession.signedIn=true;

<script>
function setupForest(){
 const vp=$('forestViewport'),world=vp?.querySelector('#forest-world');if(!vp||!world)return;
 const pointers=new Map();let prev=null,suppressClick=false;
 const tip=document.createElement('div');tip.className='forest-tree-tooltip';tip.setAttribute('role','tooltip');vp.appendChild(tip);
 const hideTreeTip=()=>{tip.classList.remove('show');tip.removeAttribute('data-for')};
 const showTreeTip=(e,tree)=>{
  if(e.pointerType&&e.pointerType!=='mouse')return hideTreeTip();
  const id=tree?.getAttribute('data-tree')||'';const c=id?get(id):null;if(!c)return hideTreeTip();
  const type=({book:'책',album:'음악',movie:'영화'}[c.type]||'콘텐츠'),genre=String(c.genre||'미분류');
  tip.innerHTML='<strong>'+esc(c.title)+'</strong><small>'+esc(type+' · '+genre)+'</small>';
  tip.setAttribute('data-for',id);tip.classList.add('show');
  const r=vp.getBoundingClientRect(),pad=10,tw=Math.min(220,Math.max(132,tip.offsetWidth||160)),th=tip.offsetHeight||48;
  let x=e.clientX-r.left+12,y=e.clientY-r.top-th-12;
  if(x+tw>r.width-pad)x=e.clientX-r.left-tw-12;if(x<pad)x=pad;if(y<pad)y=e.clientY-r.top+14;if(y+th>r.height-pad)y=r.height-th-pad;
  tip.style.left=x+'px';tip.style.top=y+'px';
 };
 vp.addEventListener('pointerleave',hideTreeTip);
 const apply=()=>{const max=(zoomState.scale-1)*190;zoomState.x=Math.max(-max,Math.min(max,zoomState.x));zoomState.y=Math.max(-max,Math.min(max,zoomState.y));world.setAttribute('transform','translate('+(360*(1-zoomState.scale)+zoomState.x)+' '+(270*(1-zoomState.scale)+zoomState.y)+') scale('+zoomState.scale+')')};
 window.applyForest=apply;
 vp.addEventListener('pointerdown',e=>{
  hideTreeTip();
  const tree=e.target.closest?.('[data-tree]');
  if(tree&&!forestEditMode){e.preventDefault(); try{tree.blur?.()}catch{}}
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY,startX:e.clientX,startY:e.clientY,moved:false,treeId:tree?.getAttribute('data-tree')||''});
  prev=null;
 });
 vp.addEventListener('pointermove',e=>{
  const hoverTree=e.target.closest?.('[data-tree]');
  if(hoverTree&&pointers.size===0)showTreeTip(e,hoverTree);else if(pointers.size===0)hideTreeTip();
  if(!pointers.has(e.pointerId))return;
  hideTreeTip();
  const before=pointers.get(e.pointerId),moved=before.moved||Math.hypot(e.clientX-before.startX,e.clientY-before.startY)>7;
  if(moved&&!before.moved){try{vp.setPointerCapture(e.pointerId)}catch{}}
  pointers.set(e.pointerId,{...before,x:e.clientX,y:e.clientY,moved});
  const pts=[...pointers.values()];
  if(pts.length>=2){const d=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y);if(prev)zoomState.scale=Math.max(1,Math.min(3.5,zoomState.scale*d/prev));prev=d}
  else if(zoomState.scale>1&&moved){zoomState.x+=(e.clientX-before.x)*720/vp.clientWidth;zoomState.y+=(e.clientY-before.y)*540/vp.clientHeight}
  apply();
 });
 const up=e=>{
  const p=pointers.get(e.pointerId);pointers.delete(e.pointerId);prev=null;
  if(!p)return;
  if(!p.moved&&p.treeId&&forestEditMode){suppressClick=true;openTreePicker(p.treeId);setTimeout(()=>suppressClick=false,0)}

<script>// Local UX session only. No remote identity provider or email service is called.
const AUTH_KEY='songrim.ux-session.v1';

let discoveryType='all',discoveryOffset=0,discoveryShown=[];
function seriesPart(c){
 if(c.type!=='book')return null;
 const match=String(c.title).normalize('NFKC').trim().match(/^(.+?[^\d\s])\s*(?:제\s*)?([1-9]\d?)(?:\s*권)?$/);
 if(!match)return null;
 return {key:Model.norm(match[1])+':'+Model.norm(c.creator),volume:Number(match[2])};
}
function orderSeries(pool){
 const groups=new Map();
 pool.forEach((c,index)=>{const part=seriesPart(c);if(!part)return;if(!groups.has(part.key))groups.set(part.key,[]);groups.get(part.key).push({c,index,volume:part.volume})});
 for(const entries of groups.values()){if(entries.length<2)continue;const sorted=[...entries].sort((a,b)=>a.volume-b.volume);entries.forEach((entry,i)=>{pool[entry.index]=sorted[i].c})}
 return pool;
}
function discoveryCatalog(){const seen=new Set();return [...CATALOG,...SEED_BOOKS.map(b=>({type:'book',title:b.title,creator:b.creator,genre:b.genre}))].filter(c=>{if(!allowDiscoveryCandidate(c))return false;const key=c.type+':'+Model.norm(c.title)+':'+Model.norm(c.creator);if(seen.has(key))return false;seen.add(key);return true})}
function renderDiscovery(){
 const completed=state.items.filter(c=>c.completed),known=discoveryCatalog();
 const refs=[...completed,...known.filter(c=>['experienced','interested'].includes(state.profile.responses?.[c.type+':'+c.title]))];
 const pool=known.filter(c=>(discoveryType==='all'||c.type===discoveryType)&&!state.items.some(x=>x.type===c.type&&Model.norm(x.title)===Model.norm(c.title)&&Model.norm(x.creator)===Model.norm(c.creator))&&!['experienced','dislike'].includes(state.profile.responses?.[c.type+':'+c.title]));
 const score=c=>refs.reduce((n,x)=>n+(x.type===c.type?1:0)+(c.genre&&x.genre===c.genre?3:0),0);
 pool.sort((a,b)=>score(b)-score(a));orderSeries(pool);if(discoveryOffset>=pool.length)discoveryOffset=0;discoveryShown=pool.slice(discoveryOffset,discoveryOffset+3);
 return '<section><div class="page-heading"><h1 class="page-title">오늘</h1></div><div class="space"></div><p class="creator">'+(completed.length?'모아둔 콘텐츠를 모두 경험했어요':'첫 관심을 모아보세요')+'</p><h2 class="section-title">다음에는 무엇이 궁금하세요?</h2><p class="creator">'+(refs.length?'지난 경험과 비슷한 유형·장르의 작품을 골라봤어요.':'책·음악·영화 중 관심 있는 것을 골라보세요.')+'</p><div class="chips">'+[['all','전체'],['book','책'],['album','음악'],['movie','영화']].map(([id,label])=>button(label,'discoveryType','chip '+(discoveryType===id?'active':''),'data-type="'+id+'"')).join('')+'</div><div class="stack">'+discoveryShown.map((c,i)=>'<div class="card"><div class="row">'+cover(c)+'<div class="grow"><small>'+typeName[c.type]+'</small><h3>'+esc(c.title)+'</h3><p class="creator">'+esc(c.creator)+'</p></div></div><div class="space"></div>'+button('보고 싶어요','discoverySave','secondary','data-index="'+i+'"')+'</div>').join('')+'</div>'+(pool.length>3?button('다른 후보 3개 보기','discoveryMore','textbtn'):'')+(!pool.length?'<p class="creator">이 유형의 준비된 후보를 모두 살펴봤어요. 다른 유형을 고르거나 직접 스크랩해보세요.</p>':'')+button('직접 스크랩하기','add','secondary')+'</section>';
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;
 if(a==='discoveryType'){discoveryType=b.dataset.type;discoveryOffset=0;render()}
 if(a==='discoveryMore'){discoveryOffset+=3;render()}

 };

let tasteLoading=false,tasteNotice='',tasteRequest=0,tasteOwner=null;
let tasteShownKeys=new Set(),tasteQueryDecks={},tasteExploreDecks={},tasteUsedQueries=new Set();
function enqueueTasteQuery(type,query){
 const key=type+':'+Model.norm(query);
 if(!Model.norm(query)||tasteUsedQueries.has(key))return;
 tasteUsedQueries.add(key);tasteExploreDecks[type].push(query);
}
function shuffleTaste(list){
 const pool=[...list];
 for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
 return pool;
}
function tasteKeys(c){
 const keys=[c.type+':text:'+Model.norm(c.title)+':'+Model.norm(c.creator)];
 if(c.recommendationKey)keys.push(c.recommendationKey);
 if(c.providerId)keys.push(c.type+':id:'+(c.provider||'')+':'+c.providerId);
 return keys;
}
function freshTasteCandidates(candidates){
 const excluded=new Set(tasteShownKeys);
 [...state.items,...tastePool.slice(tasteIndex)].forEach(c=>tasteKeys(c).forEach(key=>excluded.add(key)));
 return candidates.filter(c=>{
  if(!c.title||!['book','album','movie'].includes(c.type)||state.profile.responses?.[c.type+':'+c.title])return false;
  if(!allowDiscoveryCandidate(c))return false;
  const keys=tasteKeys(c);
  if(keys.some(key=>excluded.has(key)))return false;
  keys.forEach(key=>excluded.add(key));return true;
 });
}
function nextTasteQuery(type){
 if(tasteQueryDecks[type]?.length)return {pick:tasteQueryDecks[type].pop(),curated:true};
 const query=tasteExploreDecks[type].shift();
 return query?{pick:[query,''],curated:false}:null;
}
async function fetchTasteCandidates(type,job){
 if(!job)return [];
 const {pick,curated}=job;
 const [title,creator]=pick;
 const query=title+(creator?' '+creator:'');
 const config={book:[BOOK_SEARCH_ENDPOINT,unwrapBookDocuments,normalizeRemoteBook],album:[MUSIC_SEARCH_ENDPOINT,unwrapAlbums,normalizeRemoteAlbum],movie:[MOVIE_SEARCH_ENDPOINT,unwrapMovies,normalizeRemoteMovie]};
 const [endpoint,unwrap,normalize]=config[type];
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),12000);
 try{
  const url=type==='book'?endpoint+'?query='+encodeURIComponent(query)+'&q='+encodeURIComponent(query):endpoint;
  const headers={'Content-Type':'application/json','Accept':'application/json'};
  if(cloudSession?.access_token)headers.Authorization='Bearer '+cloudSession.access_token;
  const publicKey=cloudPublicKey();if(publicKey)headers.apikey=publicKey;
  const res=await fetch(url,{method:'POST',headers,body:JSON.stringify({query,q:query}),signal:controller.signal});
  if(!res.ok)throw Error('HTTP '+res.status);
  const works=unwrap(await res.json()).map(normalize).filter(c=>c.title&&(type!=='book'||!isExcludedBookCandidate(c))).slice(0,24);
  if(!curated)return works;
  const matches=works.filter(c=>Model.norm(c.title).includes(Model.norm(title)));
  const chosen=matches.find(c=>Model.norm(c.title)===Model.norm(title))||matches[0];
  return chosen?[{...chosen,recommendationKey:type+':curated:'+Model.norm(title)+':'+Model.norm(creator)}]:[];
 }finally{clearTimeout(timer)}
}
async function loadTasteCandidates(){
 if(tasteLoading)return;
 const request=++tasteRequest,owner=cloudSession?.user?.id||'local';
 tasteLoading=true;tasteNotice='';render();
 // Prefetch without replacing the current card. Limit empty/error retries per interaction.
 for(let attempt=0;attempt<3;attempt++){
  const activeTypes=tastePreferredType?[tastePreferredType]:['book','album','movie'];
  const jobs=activeTypes.flatMap(type=>[0,1].map(()=>({type,job:nextTasteQuery(type)}))).filter(x=>x.job);
  if(!jobs.length){tasteNotice='지금 찾을 수 있는 새 작품을 모두 살펴봤어요.';break}
  const results=await Promise.allSettled(jobs.map(({type,job})=>fetchTasteCandidates(type,job)));
  if(request!==tasteRequest)return;
  if(owner!==(cloudSession?.user?.id||'local')||authRoute!=='taste'){tasteLoading=false;return}
  const candidates=results.flatMap(r=>r.status==='fulfilled'?r.value:[]);
  candidates.forEach(c=>{
   // Follow returned authors/artists and titles to expand beyond the initial list.
   if(c.creator)enqueueTasteQuery(c.type,c.creator);
   enqueueTasteQuery(c.type,c.title);
   if(c.type==='movie')String(c.title).split(/[ :：·-]+/).filter(word=>word.length>=2).forEach(word=>enqueueTasteQuery(c.type,word));
  });
  const additions=shuffleTaste(freshTasteCandidates(candidates));
  tastePool.push(...additions);
  const failed=results.filter(r=>r.status==='rejected').length;
  if(failed===results.length){
   jobs.forEach(({type,job})=>{if(job.curated)tasteQueryDecks[type].unshift(job.pick);else tasteExploreDecks[type].push(job.pick[0])});
   tasteNotice='작품을 불러오지 못했어요. 연결을 확인하고 다시 시도해주세요.';break;
  }
  if(additions.length)break;
 }
 if(!tastePool[tasteIndex]&&!tasteNotice)tasteNotice='새 작품을 찾지 못했어요. 다른 후보를 다시 찾아볼 수 있어요.';
 tasteLoading=false;
 render();
}

  for(const type of ['book','album','movie']){
   tasteQueryDecks[type]=shuffleTaste(TASTE_QUERIES[type]);tasteExploreDecks[type]=[];
   shuffleTaste(TASTE_EXPLORE[type]).forEach(query=>enqueueTasteQuery(type,query));
  }
 }
 tasteRequest++;tasteLoading=false;tastePool=[];tasteIndex=0;tasteSeen=0;tasteReviewed=0;
 flowTo('taste');
 return loadTasteCandidates();
}

  if(err)err.textContent='계정과 데이터를 삭제하는 중이에요…';
  try{
   await deleteSongrimAccount();
   closeModal();
   render();
   toast('회원탈퇴가 완료됐어요.');
  }catch(ex){
   if(err)err.textContent=ex.message||'회원탈퇴를 완료하지 못했어요.';
   if(btn)btn.disabled=false;
  }
 }
 if(a==='flowReplay'){authSession.finished=false;saveSession();flowTo('profile')}
});
document.addEventListener('submit',async e=>{
 const f=e.target;
 if(f.id==='cloudConfigForm'){
  e.preventDefault();
  const key=$('cloudPublicKey').value.trim();
  if(!/^sb_publishable_/i.test(key) && !/^eyJ/i.test(key)){cloudSetupModal('브라우저용 Publishable key를 확인해주세요.');return}
  saveCloudPublicKey(key);closeModal();toast('Supabase 사용자 데이터 연결을 저장했어요.');render();return;
 }
 if(f.id==='flowLoginForm'||f.id==='flowSignupForm'){
  e.preventDefault();
  if(!cloudPublicKey()){cloudSetupModal('로그인 전에 Supabase Publishable key를 한 번 연결해주세요.');return}
  const email=$('flowEmail').value.trim().toLowerCase(),password=$('flowPassword').value;
  const submit=f.querySelector('[type=submit]');submit.disabled=true;
  try{
   if(f.id==='flowSignupForm'){
    if($('flowPasswordConfirm').value!==password)throw Error('비밀번호가 일치하지 않아요.');
    if(!$('flowTerms').checked)throw Error('이용 안내에 동의해주세요.');
    const data=await cloudSignup(email,password);
    authSession.name='';
    try{localStorage.setItem(CLOUD_LAST_EMAIL_STORAGE,email)}catch{}

    // 가입 직후에는 자동 진입하지 않고 로그인 화면으로 이동.
    // Supabase에서 이메일 확인이 켜져 있으면 메일 인증 후 로그인하면 된다.
    if(data?.access_token){
     saveCloudSession(data);
     await cloudLogout();
    }else{
     clearCloudSession();
    }
    authSession.signedIn=false;
    authSession.method='이메일';
    authSession.finished=false;
    saveSession();
    flowTo('login');
    setTimeout(()=>toast('가입이 완료됐어요. 로그인해주세요.'),50);
   }else{
    const data=await cloudLogin(email,password);
    authSession.signedIn=true;authSession.method='이메일';
    await cloudLoadForSignedInUser();
    authSession.name=state.profile?.name||data?.user?.user_metadata?.name||authSession.name||'';
    authSession.finished=state.onboarded===true;
    saveSession();
    flowTo(authSession.finished?'app':'profile');
   }
  }catch(err){$('flowError').textContent=err.message||'로그인 정보를 확인해주세요.'}
  finally{if(f.isConnected)submit.disabled=false}
  return;
 }
 if(f.id==='flowProfileForm'){e.preventDefault();const name=$('flowProfileName').value.trim()||'나';authSession.name=name;state.profile.name=name;saveSession();persist();flowTo('start')}
 if(f.id==='flowRecoverForm'){e.preventDefault();try{if(!cloudPublicKey())throw Error('Supabase 연결 설정이 필요해요.');await cloudRecover($('recoveryEmail').value.trim().toLowerCase());flowTo('recoverSent')}catch(err){$('flowError').textContent=err.message||'재설정 안내를 보내지 못했어요.'}}
 if(f.id==='flowTasteDateForm'){e.preventDefault();const date=$('flowTasteDate').value;if(date&&(!Model.validDate(date)||date>now())){$('flowError').textContent='오늘 또는 과거 날짜를 선택해주세요.';return}const c=Model.add(state,window.tasteCandidate);if(!c.completed){c.completed=date||'unknown';c.completedAt=Date.now()}response('experienced');nextTaste()}
});
document.addEventListener('input',e=>{if(e.target.id==='flowProfileName')e.target.setCustomValidity('')});
window.addEventListener('storage',e=>{if(e.key===AUTH_KEY){try{const a=JSON.parse(e.newValue||'null');authSession=a||{signedIn:false,finished:false};flowTo(authSession.signedIn?(authSession.finished?'app':'onboard'):'welcome')}catch{}}});
authRoute='welcome';
render();
cloudBootstrap().then(()=>render());
</script>
</body></html>
